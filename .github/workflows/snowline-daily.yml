name: Snowline — Daily Update

# Daily metadata refresh ONLY. Fast and reliable.
#
# Each morning:
#   1. Rebuilds sat_availability.json + scenes.json — every Sentinel-2 pass
#      over the AOI, from the S2 STAC GeoParquet index (one DuckDB query,
#      metadata only, no API keys).
#   2. Refreshes snotel_season.json — full current-season SWE + snow depth
#      history for every station in the bbox.
#   3. Weekly (Mondays): rebuilds snow_timeline.json, the 2015→ per-tile
#      snow history, also from index metadata.
#
# Imagery processing is in snowline-process-imagery.yml (manual workflow).

on:
  schedule:
    - cron: '0 11 * * *'  # 11am UTC daily (5am MT)
  workflow_dispatch:

# This job pushes results back AND triggers snowline-process-imagery with
# `gh workflow run`. With no permissions block the default GITHUB_TOKEN is
# read-only, so both 403'd on every scheduled run:
#   fatal: unable to access 'https://github.com/itogeo/line/': 403
#   HTTP 403: Resource not accessible by integration
# Each failure emails, which was most of this repo's daily GitHub noise.
permissions:
  contents: write
  actions: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r snowline/pipeline/requirements.txt

      - name: 1. Rebuild satellite pass tables (S2 GeoParquet)
        run: python snowline/pipeline/build_sat_availability.py

      - name: 2. Refresh SNOTEL season-wide history
        run: python snowline/pipeline/build_snotel_season.py
        env:
          GDAL_HTTP_UNSAFESSL: 'YES'

      - name: 2b. Rebuild snow timeline (Mondays or manual)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python snowline/pipeline/build_snow_timeline.py
          else
            echo "Not Monday — skipping timeline rebuild"
          fi

      - name: 3. Commit and push
        run: |
          git config user.name "snowline-bot"
          git config user.email "bot@snowline"
          git add snowline/site/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily: $(date -u +%Y-%m-%d) — satellite passes + snotel_season"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
              git pull --rebase origin main || git rebase --abort
            done
          fi

      - name: 4. Trigger imagery if new clear pass detected
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_DATE=$(python snowline/pipeline/check_new_clear_pass.py 2>/dev/null)
          if [ -n "$NEW_DATE" ]; then
            echo "New clear pass: $NEW_DATE — triggering imagery processing"
            gh workflow run snowline-process-imagery.yml \
              --repo ${{ github.repository }} \
              -f date="$NEW_DATE"
          else
            echo "No new clear passes — skipping imagery trigger"
          fi

      # Last, so a failure here never blocks the imagery trigger. The commit
      # above redeploys the site in 1-3 min, so one retry after a wait.
      - name: 5. Check the live site
        run: |
          python tools/release_check.py && exit 0
          echo "Retrying after Cloudflare redeploys..."
          sleep 180
          python tools/release_check.py
