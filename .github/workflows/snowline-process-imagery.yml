name: Snowline — Process Imagery

# Manual workflow to process Sentinel-2 imagery for specific date(s).
#
# How to run:
#   1. Go to Actions → Snowline — Process Imagery → Run workflow
#   2. Optional: enter a date (YYYY-MM-DD) to process just that date
#   3. Leave date blank to process EVERY unprocessed S2 pass from the
#      last 10 days listed in sat_availability.json, cloudy ones included
#      (their imagery still shows on the map), or set "since" to backfill:
#        gh workflow run snowline-process-imagery.yml -R itogeo/line -f since=2026-10-01
#   4. "force" reprocesses dates already on the map too (use it after an AOI
#      or grid change). Reprocessed tiles overwrite the R2 copies:
#        gh workflow run snowline-process-imagery.yml -R itogeo/line -f since=2026-10-01 -f force=true
#
# Failures: a date that fails to process fails the job, after the other dates,
# the latest view, the STAC catalog and the commit have still run. A date with
# no usable Sentinel-2 scene (all cloud or orbit-edge slivers) is skipped and
# does not fail the job.
#
# Scenes are found in the S2 STAC GeoParquet index (lib/s2index.py) and the
# pixels are read from the public Sentinel-2 Collection 1 COGs on AWS.

on:
  schedule:
    - cron: '0 13 * * *'  # 1pm UTC / 7am MT — after daily update (11am UTC)
  workflow_dispatch:
    inputs:
      date:
        description: "Date to process (YYYY-MM-DD), or blank for all unprocessed in last 10 days"
        required: false
        default: ""
      since:
        description: "Backfill: every unprocessed pass on or after this date (YYYY-MM-DD)"
        required: false
        default: ""
      force:
        description: "Reprocess dates already on the map (overwrites their R2 tiles)"
        type: boolean
        required: false
        default: false

# Pushes processed output back to the repo; a read-only GITHUB_TOKEN 403s.
permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r snowline/pipeline/requirements.txt

      - name: Build candidate list
        id: candidates
        run: |
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path
          from datetime import datetime, timedelta

          input_date = "${{ github.event.inputs.date }}".strip()
          since = "${{ github.event.inputs.since }}".strip()
          force = "${{ github.event.inputs.force }}" == "true"
          out = []

          if input_date:
              out = [input_date]
              print(f"Single date requested: {input_date}")
          else:
              SITE_DATA = Path("snowline/site/data")
              sat = json.load(open(SITE_DATA / "sat_availability.json"))
              rows = sat["rows"]

              dates_path = Path("snowline/site/data_10m/dates.json")
              existing = set()
              if dates_path.exists():
                  existing = set(json.load(open(dates_path)).get("dates", []))

              cutoff = since or (datetime.utcnow() - timedelta(days=10)).strftime("%Y-%m-%d")
              for r in rows:
                  if r["dt"] < cutoff:
                      break
                  if r["dt"] in existing and not force:
                      continue
                  # Season is Oct 1 to May 31 (lib/aoi.py in_season)
                  if 6 <= int(r["dt"][5:7]) <= 9:
                      continue
                  # Every pass, cloudy or clear, so its imagery is on the map.
                  # Skip orbit-edge slivers that barely touch the area.
                  cover = r.get("aoi_cover_pct")
                  if cover is None:
                      cover = r.get("s2aoi", 0)
                  if r.get("s2n", 0) >= 1 and cover >= 10:
                      out.append(r["dt"])
              # Newest first: if the job runs out of time, today's map is
              # the one that must exist.
              out.sort(reverse=True)
              print(f"Found {len(out)} {'passes to reprocess' if force else 'unprocessed passes'} since {cutoff}: {out}")

          with open("/tmp/dates_to_process.txt", "w") as f:
              f.write("\n".join(out))
          PYEOF

      - name: Process each date
        id: process
        run: |
          # Failures are collected here and turned into a failed job by the
          # last step, after composite, STAC, prune and commit have run.
          : > /tmp/failed_steps.txt
          if [[ ! -s /tmp/dates_to_process.txt ]]; then
            echo "Nothing to process."
            # Still fill in terrain stats for dates processed before they existed.
            python snowline/pipeline/build_terrain_stats.py --missing --fetch \
              || echo "terrain stats (build_terrain_stats)" >> /tmp/failed_steps.txt
            exit 0
          fi
          OVERWRITE_ARG=""
          [[ "${{ github.event.inputs.force }}" == "true" ]] && OVERWRITE_ARG="--overwrite"
          # "|| [[ -n ... ]]" keeps the last line, which has no trailing newline
          while IFS= read -r dt || [[ -n "$dt" ]]; do
            [[ -z "$dt" ]] && continue
            echo ""
            echo "=========================================="
            echo "Processing $dt"
            echo "=========================================="
            rc=0
            bash snowline/pipeline/update_date.sh "$dt" --max-cloud=100 $OVERWRITE_ARG || rc=$?
            if [[ $rc -eq 0 ]]; then
              if ! python snowline/pipeline/build_snotel_agreement.py --date="$dt"; then
                echo "::error::SNOTEL agreement check failed for $dt"
                echo "agreement $dt" >> /tmp/failed_steps.txt
              fi
            elif [[ $rc -eq 3 ]]; then
              echo "No usable Sentinel-2 scene for $dt (all cloud or orbit-edge slivers): skipped."
            else
              echo "::error::FAILED $dt (exit $rc) — continuing with the other dates"
              echo "date $dt (exit $rc)" >> /tmp/failed_steps.txt
            fi
          done < /tmp/dates_to_process.txt
          # Latest view: newest clear look per pixel over the last 10 days,
          # for every recent date (a new pass also improves the days after it).
          # A forced reprocess (new classifier or area) rebuilds the composite
          # for every date back to "since", not just the last 12 days.
          RECENT=12
          if [[ "${{ github.event.inputs.force }}" == "true" && -n "${{ github.event.inputs.since }}" ]]; then
            RECENT=$(python3 -c "from datetime import date; print((date.today() - date.fromisoformat('${{ github.event.inputs.since }}')).days + 1)")
          fi
          if ! python snowline/pipeline/build_composite.py --recent "$RECENT" --upload; then
            echo "::error::latest view: some dates not uploaded"
            echo "latest view (build_composite --upload)" >> /tmp/failed_steps.txt
          fi
          # Snow cover by elevation and slope direction, for every date not
          # summarised yet (new passes from disk, older ones from the site).
          # Forced: the reprocessed dates' stats are stale, redo them first.
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            while read -r dt; do
              [[ -n "$dt" ]] && python snowline/pipeline/build_terrain_stats.py --date="$dt" --fetch || echo "::warning::terrain stats $dt"
            done < /tmp/dates_to_process.txt
          fi
          if ! python snowline/pipeline/build_terrain_stats.py --missing --fetch; then
            echo "::error::terrain stats failed"
            echo "terrain stats (build_terrain_stats)" >> /tmp/failed_steps.txt
          fi
          if ! python snowline/pipeline/build_stac.py; then
            echo "::error::STAC build failed"
            echo "STAC catalog (build_stac)" >> /tmp/failed_steps.txt
          fi
        env:
          CF_ACCOUNT_ID: 3b134bb7dc7ac46e5a2ffe71302f8d69
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Prune old R2 tiles
        # Keep every snow map, and this season's imagery for every pass (free:
        # about 12 MB a pass, ~1.5 GB a season, inside R2's 10 GB free tier).
        run: |
          SEASON_START=$(python3 -c "from datetime import date; t=date.today(); print(f'{t.year if t.month >= 10 else t.year - 1}-10-01')")
          python snowline/pipeline/prune_r2.py --keep-snow 0 --keep-truecolor 10 --keep-truecolor-since "$SEASON_START"
        env:
          CF_ACCOUNT_ID: 3b134bb7dc7ac46e5a2ffe71302f8d69
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Commit and push
        # Runs even after a failure above: the successful dates are still committed.
        if: always()
        run: |
          git config user.name "snowline-bot"
          git config user.email "bot@snowline"
          git add snowline/site/data_10m/dates.json snowline/site/data/snotel_agreement.json snowline/site/data/terrain_stats.json snowline/site/data/range_stats.json snowline/site/stac
          git add 'snowline/site/data_10m/*/snowline.json' 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Imagery: $(date -u +%Y-%m-%d) — process new dates"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
              git pull --rebase origin main || git rebase --abort
            done
          fi

      - name: Fail the job if any date or step failed
        if: always()
        run: |
          if [[ "${{ steps.process.outcome }}" != "success" ]]; then
            echo "::error::Process step ended ${{ steps.process.outcome }}"
            exit 1
          fi
          if [[ -s /tmp/failed_steps.txt ]]; then
            echo "::error::Imagery run had failures:"
            cat /tmp/failed_steps.txt
            exit 1
          fi
          echo "All dates processed."
