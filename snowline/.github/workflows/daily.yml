name: Daily Update

# Daily metadata refresh ONLY. Fast and reliable.
#
# Each morning:
#   1. Rebuilds sat_availability.json — every Sentinel-2 + Landsat pass over
#      the AOI is logged so the metadata page always shows full transparency.
#   2. Refreshes snotel_season.json — full current-season SWE + snow depth
#      history for every station in the bbox.
#
# **Imagery processing is intentionally NOT done here.** A single tile takes
# 30s-2.5min to fetch from S3 + reproject + encode, and a single failure
# would tank the metadata refresh. Imagery processing lives in
# .github/workflows/process_imagery.yml as a manual workflow_dispatch.
# Run it on demand to fetch new dates' snow maps.

on:
  schedule:
    - cron: '0 11 * * *'  # 11am UTC daily (5am MT)
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: 1. Rebuild satellite availability table
        run: python pipeline/build_sat_availability.py
        env:
          GDAL_HTTP_UNSAFESSL: 'YES'

      - name: 2. Refresh SNOTEL season-wide history
        # Single source of truth for all SNOTEL data on the site. Fetches the
        # full current season (Oct 1 → today) for every station in the bbox
        # and writes site/data/snotel_season.json. Has built-in retry for
        # the flaky NRCS AWDB API.
        run: python pipeline/build_snotel_season.py
        env:
          GDAL_HTTP_UNSAFESSL: 'YES'

      - name: 3. Commit and push
        run: |
          git config user.name "snowline-bot"
          git config user.email "bot@snowline"
          git add site/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily: $(date -u +%Y-%m-%d) — sat_availability + snotel_season"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying in 10s..."
              sleep 10
              git pull --rebase origin main || git rebase --abort
            done
          fi
