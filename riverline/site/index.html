<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverLine — Montana River Conditions</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/shared/freshness.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --teal:    #3aab8a;
    --warn:    #c8973a;
    --gold:    #d4943a;
    --danger:  #c05040;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--base); color: var(--text); font-family: var(--sans); }

  #map { position: absolute; inset: 0; }

  /* Left hierarchy panel */
  #left-panel {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 264px;
    z-index: 10;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #lp-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #lp-head .wordmark { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); font-family: var(--sans); font-weight: 500; }
  #lp-head h1 { font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.1; margin: 2px 0 2px; }
  #lp-head .region { font-family: var(--mono); font-size: 11px; color: var(--accent); }
  #lp-filter { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #lp-filter input {
    width: 100%; background: var(--base); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--sans);
    font-size: 12px; padding: 5px 9px; outline: none;
  }
  #lp-filter input:focus { border-color: var(--accent); }
  #river-list { flex: 1; overflow-y: auto; }
  #river-list::-webkit-scrollbar { width: 3px; }
  #river-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
  .river-row { border-bottom: 1px solid var(--border); }
  .river-head {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 10px; cursor: pointer; transition: background 0.12s; user-select: none;
  }
  .river-head:hover { background: rgba(255,255,255,0.03); }
  .river-chevron { font-size: 13px; color: var(--muted); flex-shrink: 0; line-height: 1; display: inline-block; transition: transform 0.18s; }
  .river-row.expanded .river-chevron { transform: rotate(90deg); }
  .river-info { min-width: 0; flex: 1; }
  .river-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .river-meta { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 1px; }
  .river-gauges { display: none; background: rgba(8,15,24,0.4); }
  .river-row.expanded .river-gauges { display: block; }
  .gauge-item { padding: 6px 10px 6px 22px; cursor: pointer; border-top: 1px solid rgba(26,47,69,0.6); transition: background 0.12s; }
  .gauge-item:hover { background: rgba(74,143,186,0.06); }
  .gauge-item-name { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: var(--text); line-height: 1.3; }
  .gauge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 3px; }
  .snotel-items { margin: 4px 0 0 13px; display: flex; flex-direction: column; gap: 1px; }
  .snotel-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted); padding: 2px 4px;
    border-radius: 4px; cursor: pointer; transition: color 0.12s, background 0.12s;
  }
  .snotel-item:hover { color: var(--gold); background: rgba(212,148,58,0.07); }
  .snotel-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  #lp-legend { padding: 9px 12px; border-top: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; }
  #lp-legend .leg-row { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); }
  #lp-legend .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Layer controls */
  #layer-controls {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 155px;
  }
  #layer-controls .ctrl-label { font-size: 10px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
  .layer-toggle {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    padding: 4px 6px; border-radius: 6px;
    transition: background 0.15s;
  }
  .layer-toggle:hover { background: var(--dim); }
  .layer-toggle .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; opacity: 0.3; transition: opacity 0.15s; }
  .layer-toggle.on .dot { opacity: 1; }
  .layer-toggle span { font-size: 12px; color: var(--text); font-weight: 400; opacity: 0.55; transition: opacity 0.15s; }
  .layer-toggle.on span { opacity: 1; }

  /* Count badge */
  #gauge-count {
    position: absolute; bottom: 24px; right: 16px; z-index: 10;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  #gauge-count span { color: var(--text); }

  /* Side panel */
  #panel {
    position: absolute; top: 0; right: -400px;
    width: 360px; height: 100%;
    z-index: 20;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  #panel.open { right: 0; }
  #panel-header {
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .source-badge {
    font-size: 9px; font-family: var(--mono); font-weight: 600;
    letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0; margin-top: 3px;
  }
  .badge-usgs  { background: rgba(74,143,186,0.2);  color: var(--accent); border: 1px solid rgba(74,143,186,0.3); }
  .badge-dnrc  { background: rgba(58,171,138,0.2);  color: var(--teal);   border: 1px solid rgba(58,171,138,0.3); }
  .badge-snotel{ background: rgba(212,148,58,0.2);  color: var(--gold);   border: 1px solid rgba(212,148,58,0.3); }
  .ext-link .snotel-link { border-color: rgba(212,148,58,0.3); color: var(--gold); }
  .ext-link .snotel-link:hover { background: rgba(212,148,58,0.1); border-color: var(--gold); }
  .title-block { flex: 1; min-width: 0; }
  .gauge-name { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .gauge-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  #panel-close {
    background: none; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
    border-radius: 4px; transition: color 0.15s;
  }
  #panel-close:hover { color: var(--text); }

  #panel-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #panel-body::-webkit-scrollbar { width: 4px; }
  #panel-body::-webkit-scrollbar-track { background: transparent; }
  #panel-body::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  .cfs-hero { text-align: center; padding: 8px 0; }
  .cfs-reading { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
  .cfs-value { font-family: var(--mono); font-size: 40px; font-weight: 600; color: var(--text); line-height: 1; }
  .cfs-unit { font-size: 13px; color: var(--muted); font-weight: 400; }
  .cfs-ts { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 5px; }
  .cfs-loading { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 20px 0; }

  /* Compare mode */
  #compare-view { display: flex; flex-direction: column; gap: 8px; }
  #single-view { display: flex; flex-direction: column; gap: 16px; }
  #station-cards { display: flex; flex-direction: column; gap: 10px; }
  .station-card { background: var(--base); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; border-bottom: 1px solid var(--border); }
  .card-name { flex: 1; font-size: 12px; color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-remove { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1; border-radius: 3px; }
  .card-remove:hover { color: var(--text); }
  .card-value-wrap { padding: 6px 10px 4px; }
  .card-value { font-family: var(--mono); font-size: 24px; font-weight: 600; color: var(--text); }
  .card-value-unit { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .compare-chart-wrap { height: 90px; padding: 0 4px 6px; }
  #compare-range-btns { display: flex; gap: 4px; }

  .section-label { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .chart-wrap { height: 150px; position: relative; }

  #range-btns { display: flex; gap: 4px; }
  .range-btn {
    font-family: var(--mono); font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s; line-height: 1.6;
  }
  .range-btn.active, .range-btn:hover {
    border-color: var(--accent); color: var(--accent); background: rgba(74,143,186,0.08);
  }

  .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-row .lbl { font-size: 12px; color: var(--muted); }
  .info-row .val { font-family: var(--mono); font-size: 12px; color: var(--text); text-align: right; }

  .ext-link { text-align: center; margin-top: 4px; }
  .ext-link a {
    font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid rgba(74,143,186,0.3); border-radius: 6px;
    padding: 6px 14px; display: inline-block;
    transition: background 0.15s, border-color 0.15s;
  }
  .ext-link a:hover { background: rgba(74,143,186,0.1); border-color: var(--accent); }

  /* Mapbox overrides */
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { display: none !important; }
  .mapboxgl-ctrl-group { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; box-shadow: none !important; }
  .mapboxgl-ctrl-group button { background: transparent !important; }
  .mapboxgl-ctrl-group button + button { border-top: 1px solid var(--border) !important; }
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon { filter: invert(1) brightness(0.6); }

  /* Loading overlay */
  #loading {
    position: absolute; inset: 0; z-index: 30;
    background: var(--base); display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .load-text { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--dim);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="load-text">Loading gauges…</div>
</div>

<div id="map"></div>

<div id="left-panel">
  <div id="lp-head">
    <div class="wordmark">itogeospatial</div>
    <h1>River Conditions</h1>
    <span class="region">Montana</span>
  </div>
  <div id="lp-filter">
    <input type="text" id="river-search" placeholder="Filter rivers…">
  </div>
  <div id="river-list"></div>
  <div id="lp-legend">
    <div class="leg-row"><div class="leg-dot" style="background:var(--accent)"></div>USGS gauge</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--teal)"></div>DNRC gauge</div>
    <div class="leg-row"><div class="leg-dot" style="background:var(--gold)"></div>SNOTEL station</div>
  </div>
</div>

<div id="layer-controls">
  <div class="ctrl-label">LAYERS</div>
  <div class="layer-toggle on" id="toggle-usgs" data-layers="usgs-points">
    <div class="dot" style="background:var(--accent)"></div>
    <span>USGS gauges</span>
  </div>
  <div class="layer-toggle on" id="toggle-dnrc" data-layers="dnrc-points">
    <div class="dot" style="background:var(--teal)"></div>
    <span>DNRC gauges</span>
  </div>
  <div class="layer-toggle on" id="toggle-snotel" data-layers="snotel-points">
    <div class="dot" style="background:var(--gold)"></div>
    <span>SNOTEL</span>
  </div>
  <div class="layer-toggle on" id="toggle-streams" data-layers="mt-streams">
    <div class="dot" style="background:#5b8db8; border-radius:1px; height:3px; width:14px;"></div>
    <span>MT streams</span>
  </div>
  <div class="layer-toggle" id="toggle-lakes" data-layers="lakes-fill,lakes-stroke">
    <div class="dot" style="background:#3a7db5; border-radius:2px; width:12px; height:12px;"></div>
    <span>Lakes</span>
  </div>
  <div class="layer-toggle" id="toggle-basins" data-layers="mt-basins-fill,mt-basins-line">
    <div class="dot" style="background:var(--muted); border-radius:1px;"></div>
    <span>HUC8 basins</span>
  </div>
</div>


<div id="gauge-count">
  <span id="usgs-ct">—</span> USGS · <span id="dnrc-ct">—</span> DNRC · <span id="snotel-ct">—</span> SNOTEL
</div>

<div id="panel">
  <div id="panel-header">
    <span class="source-badge badge-usgs" id="panel-badge">USGS</span>
    <div class="title-block">
      <div class="gauge-name" id="panel-name">—</div>
      <div class="gauge-sub" id="panel-id">—</div>
    </div>
    <button id="panel-close" title="Close">×</button>
  </div>
  <div id="panel-body">
    <div id="compare-view" style="display:none">
      <div id="compare-range-btns"></div>
      <div id="station-cards"></div>
    </div>
    <div id="single-view">
      <div class="cfs-hero" id="cfs-hero"><div class="cfs-loading">Loading…</div></div>
      <div id="chart-section" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div class="section-label" id="chart-label" style="margin-bottom:0">Flow History</div>
          <div id="range-btns" style="display:none">
            <button class="range-btn active" data-range="14">14D</button>
            <button class="range-btn" data-range="30">30D</button>
            <button class="range-btn" data-range="365">1Y</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="flow-chart"></canvas></div>
      </div>
      <div id="info-section"></div>
      <div class="ext-link" id="ext-link"></div>
    </div>
  </div>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiaXRvZ2VvIiwiYSI6ImNta3ByYnA1bzBsYW0zZG9mMnMxdWZwMjUifQ.Q7pwAuAEKdBHD_dqaVBhvw';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [-109.5, 47.0],
  zoom: 5.2,
  minZoom: 4,
  maxZoom: 16,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

const DNRC_BASE = 'https://gis.dnrc.mt.gov/arcgis/rest/services/WRD/WMB_StAGE/MapServer/export';
function arcgisTile(layerIds) {
  return `${DNRC_BASE}?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&layers=show:${layerIds}&size=256,256&f=image&format=png32&transparent=true&dpi=96`;
}

let flowChart = null;
let noaaMap = {};
let dnrcSnotelLinks = {};
let snotelFeaturesMap = {};
let currentSiteId = null;
let currentPanelType = null;
let currentSnotelFeature = null;
let selectedStations = [];
const MAX_SELECTED = 3;
let compareGeneration = 0;
let compareDays = 14;

const panel     = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelId   = document.getElementById('panel-id');
const panelBadge = document.getElementById('panel-badge');
const cfsHero   = document.getElementById('cfs-hero');
const chartSection = document.getElementById('chart-section');
const infoSection  = document.getElementById('info-section');
const extLink      = document.getElementById('ext-link');

document.getElementById('panel-close').addEventListener('click', closePanel);
function closePanel() {
  panel.classList.remove('open');
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  selectedStations.forEach(s => { if (s.chart) { s.chart.destroy(); s.chart = null; } });
  selectedStations = [];
  const sv = document.getElementById('single-view');
  const cv = document.getElementById('compare-view');
  if (sv) sv.style.display = '';
  if (cv) cv.style.display = 'none';
  if (window._clearBasinHighlight) window._clearBasinHighlight();
  if (window._clearRiverHighlight) window._clearRiverHighlight();
  if (window._clearStationHighlight) window._clearStationHighlight();
}

function openPanel(name, id, badgeClass) {
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  selectedStations.forEach(s => { if (s.chart) { s.chart.destroy(); s.chart = null; } });
  const sv = document.getElementById('single-view');
  const cv = document.getElementById('compare-view');
  if (sv) sv.style.display = '';
  if (cv) cv.style.display = 'none';
  panelBadge.style.display = '';
  panelName.textContent = name;
  panelId.textContent = id;
  panelBadge.className = 'source-badge ' + badgeClass;
  panelBadge.textContent = badgeClass.includes('usgs') ? 'USGS' : badgeClass.includes('dnrc') ? 'DNRC' : 'SNOTEL';
  cfsHero.innerHTML = '<div class="cfs-loading">Loading…</div>';
  chartSection.style.display = 'none';
  document.getElementById('range-btns').style.display = 'none';
  infoSection.innerHTML = '';
  extLink.innerHTML = '';
  panel.classList.add('open');
}

function nDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString().slice(0, 10);
}

async function openUsgsPanel(feature) {
  const { id, name } = feature.properties;
  currentSiteId = id;
  currentPanelType = 'usgs';
  openPanel(name, id, 'badge-usgs');
  chartSection.style.display = '';
  const rangeBtns = document.getElementById('range-btns');
  rangeBtns.innerHTML = `
    <button class="range-btn active" data-range="14">14D</button>
    <button class="range-btn" data-range="30">30D</button>
    <button class="range-btn" data-range="365">1Y</button>`;
  rangeBtns.style.display = 'flex';
  await loadUsgsChart(id, 14);
}

async function loadUsgsChart(siteId, days) {
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  cfsHero.innerHTML = '<div class="cfs-loading">Loading…</div>';
  infoSection.innerHTML = '';

  try {
    let flowVals = [], stageVals = [];

    if (days <= 30) {
      const url = `https://waterservices.usgs.gov/nwis/iv/?sites=${siteId}&parameterCd=00060,00065&format=json&period=P${days}D`;
      const data = await fetch(url).then(r => r.json());
      const series = data?.value?.timeSeries || [];
      const flowSeries  = series.find(s => s.variable?.variableCode?.[0]?.value === '00060');
      const stageSeries = series.find(s => s.variable?.variableCode?.[0]?.value === '00065');
      flowVals  = flowSeries?.values?.[0]?.value  || [];
      stageVals = stageSeries?.values?.[0]?.value || [];
    } else {
      const url = `https://waterservices.usgs.gov/nwis/dv/?sites=${siteId}&parameterCd=00060&format=json&startDT=${nDaysAgo(days)}`;
      const data = await fetch(url).then(r => r.json());
      const series = data?.value?.timeSeries || [];
      const flowSeries = series.find(s => s.variable?.variableCode?.[0]?.value === '00060');
      flowVals = (flowSeries?.values?.[0]?.value || []).filter(v => parseFloat(v.value) >= 0);
    }

    if (!flowVals.length) {
      cfsHero.innerHTML = '<div class="cfs-loading">No streamflow data</div>';
      extLink.innerHTML = `<a href="https://waterdata.usgs.gov/monitoring-location/${siteId}/" target="_blank" rel="noopener">USGS Water Data ↗</a>`;
      return;
    }

    const current = flowVals[flowVals.length - 1];
    const cfs = parseFloat(current?.value);
    const ts  = current?.dateTime;
    if (!isNaN(cfs) && cfs >= 0) {
      cfsHero.innerHTML = `
        <div class="cfs-reading">
          <span class="cfs-value">${cfs.toLocaleString()}</span>
          <span class="cfs-unit">cfs</span>
        </div>
        <div class="cfs-ts">${ts ? formatTimestampMT(ts) : ''}</div>`;
    } else {
      cfsHero.innerHTML = '<div class="cfs-loading">No current reading</div>';
    }

    // NOAA forecast if we have a matching LID
    const noaaLid = noaaMap[siteId.padStart(8, '0')] || noaaMap[siteId];
    let noaaForecast = [];
    if (noaaLid) {
      try {
        const nd = await fetch(`/api/noaa/${noaaLid}/stageflow`).then(r => r.json());
        const mult = (nd?.secondaryUnit || '').toLowerCase() === 'kcfs' ? 1000 : 1;
        noaaForecast = (nd?.forecast?.data || []).map(v => ({
          validTime: v.validTime, flow: (v.secondary || 0) * mult,
        }));
      } catch(_) {}
    }

    // Downsample observed + forecast for chart
    const MAX_OBS = 200;
    const step = Math.max(1, Math.floor(flowVals.length / MAX_OBS));
    const sampledObs = flowVals.filter((_, i) => i % step === 0);
    const fcStep = Math.max(1, Math.floor(noaaForecast.length / 40));
    const sampledFc = noaaForecast.filter((_, i) => i % fcStep === 0);

    // Merge observed + forecast onto single timeline
    const obsMap = new Map(sampledObs.map(v => [v.dateTime, parseFloat(v.value)]));
    const fcMap  = new Map(sampledFc.map(v => [v.validTime, v.flow]));
    const allKeys = [...new Set([...obsMap.keys(), ...fcMap.keys()])].sort((a, b) => new Date(a) - new Date(b));

    const labels = allKeys.map(t => {
      const d = new Date(t);
      return days >= 365
        ? `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`
        : `${d.getMonth()+1}/${d.getDate()}`;
    });

    const obsData = allKeys.map(t => obsMap.has(t) ? obsMap.get(t) : null);
    const fcData  = allKeys.map(t => fcMap.has(t)  ? fcMap.get(t)  : null);

    // Fetch USGS historical mean by day-of-year for the average overlay
    let avgData = [];
    try {
      const statsUrl = `https://waterservices.usgs.gov/nwis/stat/?format=json&sites=${siteId}&parameterCd=00060&statReportType=daily&statYearType=calendar`;
      const statsJson = await fetch(statsUrl).then(r => r.json());
      const allSeries = statsJson?.value?.timeSeries || [];
      const meanSeries = allSeries.find(s => {
        const opts = s?.variable?.options?.option || [];
        return opts.some(o => o.name === 'statType' && (o.value === '00003' || o.value === '3'));
      }) || allSeries.find(s => (s?.variable?.variableDescription || '').toLowerCase().includes('mean'));
      if (meanSeries) {
        const meanVals = meanSeries?.values?.[0]?.value || [];
        const doyMap = new Map(); // "MM-DD" → mean cfs
        for (const v of meanVals) {
          const mmdd = (v.dateTime || '').slice(5, 10); // "MM-DD" (reference year varies)
          if (mmdd && v.value && v.value !== '-999999') doyMap.set(mmdd, parseFloat(v.value));
        }
        avgData = allKeys.map(t => {
          const mmdd = new Date(t).toISOString().slice(5, 10);
          return doyMap.has(mmdd) ? doyMap.get(mmdd) : null;
        });
      }
    } catch(_) {}

    const datasets = [{
      data: obsData,
      borderColor: 'rgba(74,143,186,0.85)', borderWidth: 1.5,
      fill: true, backgroundColor: 'rgba(74,143,186,0.08)',
      pointRadius: 0, tension: 0.2, spanGaps: false,
    }];
    if (avgData.some(v => v !== null)) {
      datasets.push({
        data: avgData,
        borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1,
        borderDash: [4, 3],
        fill: false, pointRadius: 0, tension: 0.3, spanGaps: true,
      });
    }
    if (sampledFc.length) {
      datasets.push({
        data: fcData,
        borderColor: 'rgba(74,143,186,0.5)', borderWidth: 1.5,
        borderDash: [5, 3],
        fill: false, pointRadius: 0, tension: 0.3, spanGaps: false,
      });
    }

    const ctx = document.getElementById('flow-chart').getContext('2d');
    flowChart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            callbacks: {
              label: c => c.datasetIndex === 1 && avgData.length ? (c.parsed.y !== null ? c.parsed.y.toLocaleString() + ' cfs avg' : '') : (c.parsed.y !== null ? c.parsed.y.toLocaleString() + ' cfs' : ''),
            },
            backgroundColor: 'rgba(14,28,45,0.95)', titleColor: '#455a70',
            bodyColor: '#d4dde8', borderColor: '#1a2f45', borderWidth: 1,
          },
        },
        scales: {
          x: {
            ticks: {
              color: '#455a70', font: { family: 'JetBrains Mono', size: 9 },
              maxTicksLimit: 7, maxRotation: 0,
            },
            grid: { display: false },
            border: { display: false },
          },
          y: {
            ticks: { color: '#455a70', font: { family: 'JetBrains Mono', size: 10 },
              callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v },
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { display: false },
          },
        },
      },
    });

    const rows = [];
    if (stageVals.length) {
      const sv = stageVals[stageVals.length - 1];
      const ft = parseFloat(sv?.value);
      if (!isNaN(ft)) rows.push({ lbl: 'Gage height', val: ft.toFixed(2) + ' ft' });
    }
    if (noaaLid) rows.push({ lbl: 'NOAA site', val: noaaLid + (sampledFc.length ? ' · forecast available' : '') });
    rows.push({ lbl: 'Site ID', val: siteId });
    infoSection.innerHTML = rows.map(r =>
      `<div class="info-row"><span class="lbl">${r.lbl}</span><span class="val">${r.val}</span></div>`
    ).join('');
    extLink.innerHTML = `<a href="https://waterdata.usgs.gov/monitoring-location/${siteId}/" target="_blank" rel="noopener">USGS Water Data ↗</a>`;

  } catch(e) {
    cfsHero.innerHTML = '<div class="cfs-loading">Fetch error</div>';
    extLink.innerHTML = `<a href="https://waterdata.usgs.gov/monitoring-location/${siteId}/" target="_blank" rel="noopener">USGS Water Data ↗</a>`;
  }
}

async function openSnotelPanel(feature) {
  const { triplet, name } = feature.properties;
  currentPanelType = 'snotel';
  currentSnotelFeature = feature;
  openPanel(name, triplet, 'badge-snotel');
  chartSection.style.display = '';

    <button class="range-btn active" data-range="49">7W</button>

}

async function loadSnotelChart(feature, days) {
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  cfsHero.innerHTML = '<div class="cfs-loading">Loading…</div>';
  const { triplet, elevation_ft, county } = feature.properties;
  try {
    const rawArr = await fetch(`/api/snotel?triplet=${encodeURIComponent(triplet)}&days=${days}`).then(r => r.json());
    const blocks = rawArr?.[0]?.data || [];

    function latestVal(code) {
      const b = blocks.find(x => x.stationElement?.elementCode === code);
      const vals = (b?.values || []).filter(v => v.value != null);
      if (!vals.length) return null;
      const last = vals[vals.length - 1];
      return { value: parseFloat(last.value), date: last.date };
    }

    const swe   = latestVal('WTEQ');
    const depth = latestVal('SNWD');
    const tobs  = latestVal('TOBS');

    if (swe !== null) {
      cfsHero.innerHTML = `
        <div class="cfs-reading">
          <span class="cfs-value" style="color:var(--gold)">${swe.value.toFixed(1)}</span>
          <span class="cfs-unit">in SWE</span>
        </div>
        <div class="cfs-ts">${swe.date}</div>`;
    } else {
      cfsHero.innerHTML = '<div class="cfs-loading">No SWE data</div>';
    }

    const sweBlock = blocks.find(x => x.stationElement?.elementCode === 'WTEQ');
    const sweVals = (sweBlock?.values || []).filter(v => v.value != null);
    if (sweVals.length > 1) {
      const rangeLabel = days >= 365 ? '1-Year SWE' : days >= 49 ? '7-Week SWE' : 'SWE';
      document.getElementById('chart-label').textContent = rangeLabel;
      const ctx = document.getElementById('flow-chart').getContext('2d');
      flowChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sweVals.map(v => {
            const d = new Date(v.date);
            return days >= 365
              ? `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`
              : `${d.getMonth()+1}/${d.getDate()}`;
          }),
          datasets: [{
            data: sweVals.map(v => parseFloat(v.value)),
            borderColor: 'rgba(212,148,58,0.85)', borderWidth: 1.5,
            fill: true, backgroundColor: 'rgba(212,148,58,0.08)',
            pointRadius: 0, tension: 0.2,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              mode: 'index', intersect: false,
              callbacks: { label: c => c.parsed.y.toFixed(1) + ' in SWE' },
              backgroundColor: 'rgba(14,28,45,0.95)', titleColor: '#455a70',
              bodyColor: '#d4dde8', borderColor: '#1a2f45', borderWidth: 1,
            },
          },
          scales: {
            x: {
              ticks: {
                color: '#455a70', font: { family: 'JetBrains Mono', size: 9 },
                maxTicksLimit: 7, maxRotation: 0,
              },
              grid: { display: false },
              border: { display: false },
            },
            y: {
              ticks: { color: '#455a70', font: { family: 'JetBrains Mono', size: 10 },
                callback: v => v.toFixed(1) + '″' },
              grid: { color: 'rgba(255,255,255,0.04)' },
              border: { display: false },
            },
          },
        },
      });
    }

    const rows = [];
    if (depth) rows.push({ lbl: 'Snow depth', val: depth.value.toFixed(0) + ' in' });
    if (tobs)  rows.push({ lbl: 'Air temp',   val: tobs.value.toFixed(0) + '°F' });
    if (elevation_ft) rows.push({ lbl: 'Elevation', val: parseInt(elevation_ft).toLocaleString() + ' ft' });
    if (county) rows.push({ lbl: 'County', val: county });
    rows.push({ lbl: 'Network', val: 'NRCS SNOTEL' });
    infoSection.innerHTML = rows.map(r =>
      `<div class="info-row"><span class="lbl">${r.lbl}</span><span class="val">${r.val}</span></div>`
    ).join('');
    const stationId = triplet.split(':')[0];
    extLink.innerHTML = `<a class="snotel-link" href="https://wcc.sc.egov.usda.gov/nwcc/site?sitenum=${stationId}" target="_blank" rel="noopener">NRCS Station ↗</a>`;
  } catch(e) {
    cfsHero.innerHTML = '<div class="cfs-loading">Fetch error</div>';
  }
}

function selectStation(type, feature) {
  const id = type === 'snotel' ? feature.properties.triplet : feature.properties.id;
  const idx = selectedStations.findIndex(s => s.type === type && s.id === id);
  if (idx >= 0) {
    const [removed] = selectedStations.splice(idx, 1);
    if (removed.chart) { removed.chart.destroy(); removed.chart = null; }
    if (!selectedStations.length) { closePanel(); return; }
  } else {
    if (selectedStations.length >= MAX_SELECTED) {
      const removed = selectedStations.shift();
      if (removed.chart) { removed.chart.destroy(); removed.chart = null; }
    }
    selectedStations.push({ type, id, feature, name: feature.properties.name || id, chart: null });
  }
  if (selectedStations.length === 1) {
    const s = selectedStations[0];
    if (s.type === 'usgs') openUsgsPanel(s.feature);
    else if (s.type === 'snotel') openSnotelPanel(s.feature);
    else if (s.type === 'dnrc') openDnrcPanel(s.feature);
  } else {
    renderCompareMode();
  }
}

function removeStation(idx) {
  const removed = selectedStations.splice(idx, 1)[0];
  if (removed && removed.chart) { removed.chart.destroy(); removed.chart = null; }
  if (!selectedStations.length) { closePanel(); return; }
  if (selectedStations.length === 1) {
    const s = selectedStations[0];
    if (s.type === 'usgs') openUsgsPanel(s.feature);
    else if (s.type === 'snotel') openSnotelPanel(s.feature);
    else if (s.type === 'dnrc') openDnrcPanel(s.feature);
  } else {
    renderCompareMode();
  }
}

function renderCompareMode() {
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  selectedStations.forEach(s => { if (s.chart) { s.chart.destroy(); s.chart = null; } });
  const sv = document.getElementById('single-view');
  const cv = document.getElementById('compare-view');
  if (sv) sv.style.display = 'none';
  if (cv) cv.style.display = '';
  panelBadge.style.display = 'none';
  panelName.textContent = `${selectedStations.length} Stations`;
  panelId.textContent = 'Compare';
  panel.classList.add('open');
  const cmpRange = document.getElementById('compare-range-btns');
  cmpRange.innerHTML = `
    <button class="range-btn ${compareDays===14?'active':''}" data-range="14">14D</button>
    <button class="range-btn ${compareDays===30?'active':''}" data-range="30">30D</button>
    <button class="range-btn ${compareDays===365?'active':''}" data-range="365">1Y</button>`;
  cmpRange.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      compareDays = parseInt(btn.dataset.range);
      cmpRange.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderStationCards();
    });
  });
  renderStationCards();
}

function renderStationCards() {
  selectedStations.forEach(s => { if (s.chart) { s.chart.destroy(); s.chart = null; } });
  compareGeneration++;
  const gen = compareGeneration;
  const container = document.getElementById('station-cards');
  container.innerHTML = '';
  selectedStations.forEach((s, idx) => {
    const badgeClass = s.type === 'usgs' ? 'badge-usgs' : s.type === 'dnrc' ? 'badge-dnrc' : 'badge-snotel';
    const badgeText = s.type.toUpperCase();
    const canvasId = `compare-chart-${idx}`;
    const card = document.createElement('div');
    card.className = 'station-card';
    card.innerHTML = `
      <div class="card-head">
        <span class="source-badge ${badgeClass}">${badgeText}</span>
        <span class="card-name">${s.name}</span>
        <button class="card-remove" aria-label="Remove">×</button>
      </div>
      <div class="card-value-wrap" id="card-val-${idx}"><span class="cfs-loading" style="font-size:11px;padding:6px 0">Loading…</span></div>
      <div class="compare-chart-wrap"><canvas id="${canvasId}"></canvas></div>`;
    container.appendChild(card);
    card.querySelector('.card-remove').addEventListener('click', () => removeStation(idx));
    loadCompareChart(s, idx, canvasId, compareDays, gen);
  });
}

async function loadCompareChart(station, idx, canvasId, days, gen) {
  const valWrap = document.getElementById(`card-val-${idx}`);
  const noData = msg => { if (valWrap && gen === compareGeneration) valWrap.innerHTML = `<span class="cfs-loading" style="font-size:11px;padding:6px 0">${msg}</span>`; };
  try {
    if (station.type === 'usgs') {
      const url = days <= 30
        ? `https://waterservices.usgs.gov/nwis/iv/?sites=${station.id}&parameterCd=00060&format=json&period=P${days}D`
        : `https://waterservices.usgs.gov/nwis/dv/?sites=${station.id}&parameterCd=00060&format=json&startDT=${nDaysAgo(days)}`;
      const data = await fetch(url).then(r => r.json());
      if (gen !== compareGeneration) return;
      const series = data?.value?.timeSeries || [];
      const flowSeries = series.find(s => s.variable?.variableCode?.[0]?.value === '00060');
      const flowVals = (flowSeries?.values?.[0]?.value || []).filter(v => parseFloat(v.value) >= 0);
      if (!flowVals.length) { noData('No data'); return; }
      const cur = flowVals[flowVals.length - 1];
      const cfs = parseFloat(cur.value);
      if (valWrap && gen === compareGeneration) valWrap.innerHTML = `<span class="card-value">${cfs.toLocaleString()}<span class="card-value-unit">cfs</span></span>`;
      const step = Math.max(1, Math.floor(flowVals.length / 120));
      const sampled = flowVals.filter((_, i) => i % step === 0);
      const labels = sampled.map(v => { const d = new Date(v.dateTime); return `${d.getMonth()+1}/${d.getDate()}`; });
      const values = sampled.map(v => parseFloat(v.value));
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (ctx && gen === compareGeneration) station.chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ data: values, borderColor: 'rgba(74,143,186,0.85)', borderWidth: 1.5, fill: true, backgroundColor: 'rgba(74,143,186,0.08)', pointRadius: 0, tension: 0.2 }] },
        options: compactChartOptions(),
      });
    } else if (station.type === 'snotel') {
      const rawArr = await fetch(`/api/snotel?triplet=${encodeURIComponent(station.id)}&days=${days}`).then(r => r.json());
      if (gen !== compareGeneration) return;
      const blocks = rawArr?.[0]?.data || [];
      const sweBlock = blocks.find(x => x.stationElement?.elementCode === 'WTEQ');
      const sweVals = (sweBlock?.values || []).filter(v => v.value != null);
      if (!sweVals.length) { noData('No SWE data'); return; }
      const last = sweVals[sweVals.length - 1];
      if (valWrap && gen === compareGeneration) valWrap.innerHTML = `<span class="card-value" style="color:var(--gold)">${parseFloat(last.value).toFixed(1)}<span class="card-value-unit">in SWE</span></span>`;
      const labels = sweVals.map(v => { const d = new Date(v.date); return `${d.getMonth()+1}/${d.getDate()}`; });
      const values = sweVals.map(v => parseFloat(v.value));
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (ctx && gen === compareGeneration) station.chart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [{ data: values, borderColor: 'rgba(212,148,58,0.85)', borderWidth: 1.5, fill: true, backgroundColor: 'rgba(212,148,58,0.08)', pointRadius: 0, tension: 0.2 }] },
        options: compactChartOptions(),
      });
    } else if (station.type === 'dnrc') {
      noData('No data available');
    }
  } catch(_) { noData('Error'); }
}

function compactChartOptions() {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        mode: 'index', intersect: false,
        backgroundColor: 'rgba(14,28,45,0.95)', titleColor: '#455a70',
        bodyColor: '#d4dde8', borderColor: '#1a2f45', borderWidth: 1,
      },
    },
    scales: {
      x: {
        ticks: { color: '#455a70', font: { family: 'JetBrains Mono', size: 8 }, maxTicksLimit: 4, maxRotation: 0 },
        grid: { display: false }, border: { display: false },
      },
      y: {
        ticks: { color: '#455a70', font: { family: 'JetBrains Mono', size: 8 }, callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v },
        grid: { color: 'rgba(255,255,255,0.04)' }, border: { display: false },
      },
    },
  };
}

function dismissLoading() {
  const el = document.getElementById('loading');
  el.classList.add('hidden');
  setTimeout(() => { el.style.display = 'none'; }, 400);
}

async function loadHierarchy(usgsData, snotelData) {
  const hierarchy = await fetch('/data/river_hierarchy.json').then(r => r.json()).catch(() => null);
  if (!hierarchy) return;
  const { rivers, snotel: snotelMeta } = hierarchy;

  const gaugeFeatures = {};
  if (usgsData) for (const f of usgsData.features) gaugeFeatures[f.properties.id] = f;
  const snotelFeatures = {};
  if (snotelData) for (const f of snotelData.features) snotelFeatures[f.properties.triplet] = f;

  // Forward map (gauge → upstream snotel) and reverse map (snotel triplet → downstream gauge IDs)
  const gaugeData = {};
  const snotelToGauges = {};
  for (const river of rivers) {
    for (const g of river.gauges) {
      gaugeData[g.id] = g;
      for (const t of (g.upstream_snotel || [])) {
        if (!snotelToGauges[t]) snotelToGauges[t] = [];
        if (!snotelToGauges[t].includes(g.id)) snotelToGauges[t].push(g.id);
      }
    }
  }

  map.addSource('usgs-hl-src',   { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource('snotel-hl-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({ id: 'usgs-hl', type: 'circle', source: 'usgs-hl-src', paint: {
    'circle-color': '#ffffff',
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 8, 10, 14],
    'circle-stroke-color': '#4a8fba',
    'circle-stroke-width': 3,
  }});
  map.addLayer({ id: 'snotel-hl', type: 'circle', source: 'snotel-hl-src', paint: {
    'circle-color': '#ffffff',
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 8, 10, 14],
    'circle-stroke-color': '#d4943a',
    'circle-stroke-width': 3,
  }});

  function setHL(gaugeIds, triplets) {
    map.getSource('usgs-hl-src').setData({
      type: 'FeatureCollection',
      features: gaugeIds.map(id => gaugeFeatures[id]).filter(Boolean),
    });
    map.getSource('snotel-hl-src').setData({
      type: 'FeatureCollection',
      features: triplets.map(t => snotelFeatures[t]).filter(Boolean),
    });
  }

  let activeRow = null;
  const listEl = document.getElementById('river-list');

  window._highlightGauge       = id      => setHL([id], gaugeData[id]?.upstream_snotel || []);
  window._highlightSnotel      = triplet => setHL(snotelToGauges[triplet] || [], [triplet]);
  window._highlightDnrc        = dnrcId  => setHL([], (dnrcSnotelLinks[dnrcId] || []).map(s => s.triplet));
  window._clearStationHighlight = ()     => setHL([], []);
  window._openRiverByName = gnisName => {
    const q = (gnisName || '').toLowerCase().trim();
    listEl.querySelectorAll('.river-row').forEach(row => {
      const n = row.querySelector('.river-name')?.textContent?.toLowerCase()?.trim() || '';
      if (n === q || n.includes(q) || q.startsWith(n.split(' ')[0].toLowerCase())) {
        row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        if (!row.classList.contains('expanded')) row.querySelector('.river-head').click();
      }
    });
  };

  for (const river of rivers) {
    const allSnotel = [...new Set(river.gauges.flatMap(g => g.upstream_snotel))];
    const gaugesHtml = river.gauges.map(g => {
      const sItems = g.upstream_snotel.map(t => {
        const st = snotelMeta[t];
        return st
          ? `<div class="snotel-item" data-triplet="${t}" data-lng="${st.coords[0]}" data-lat="${st.coords[1]}"><span class="snotel-dot"></span>${st.name}</div>`
          : '';
      }).join('');
      return `<div class="gauge-item" data-gauge-id="${g.id}" data-lng="${g.coords[0]}" data-lat="${g.coords[1]}">`
        + `<div class="gauge-item-name"><span class="gauge-dot"></span><span>${g.name}</span></div>`
        + (sItems ? `<div class="snotel-items">${sItems}</div>` : '') + '</div>';
    }).join('');

    const rowEl = document.createElement('div');
    rowEl.className = 'river-row';
    rowEl.innerHTML =
      `<div class="river-head"><span class="river-chevron">›</span><div class="river-info">`
      + `<div class="river-name">${river.name}</div>`
      + `<div class="river-meta">${river.gauges.length} gauge${river.gauges.length !== 1 ? 's' : ''} · ${allSnotel.length} SNOTEL</div>`
      + `</div></div><div class="river-gauges">${gaugesHtml}</div>`;

    rowEl.querySelector('.river-head').addEventListener('click', () => {
      const expanding = !rowEl.classList.contains('expanded');
      if (activeRow && activeRow !== rowEl) activeRow.classList.remove('expanded');
      rowEl.classList.toggle('expanded', expanding);
      activeRow = expanding ? rowEl : null;
      if (expanding) {
        setHL(river.gauges.map(g => g.id), []);
        if (river.gauges.length) {
          const lngs = river.gauges.map(g => g.coords[0]);
          const lats = river.gauges.map(g => g.coords[1]);
          map.fitBounds(
            [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
            { padding: { top: 60, bottom: 60, left: 284, right: 60 }, maxZoom: 11, duration: 600 },
          );
        }
      } else {
        setHL([], []);
      }
    });

    rowEl.querySelectorAll('.gauge-item').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const f = gaugeFeatures[el.dataset.gaugeId];
        if (f) selectStation('usgs', f);
        map.flyTo({ center: [+el.dataset.lng, +el.dataset.lat], zoom: 11, duration: 600 });
        setHL([el.dataset.gaugeId], gaugeData[el.dataset.gaugeId]?.upstream_snotel || []);
      });
    });

    rowEl.querySelectorAll('.snotel-item').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const f = snotelFeatures[el.dataset.triplet];
        if (f) selectStation('snotel', f);
        map.flyTo({ center: [+el.dataset.lng, +el.dataset.lat], zoom: 11, duration: 600 });
        setHL(snotelToGauges[el.dataset.triplet] || [], [el.dataset.triplet]);
      });
    });

    listEl.appendChild(rowEl);
  }

  document.getElementById('river-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    listEl.querySelectorAll('.river-row').forEach(row => {
      row.style.display = row.querySelector('.river-name').textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

map.on('load', async () => {
  try {
    // Hillshade — DEM-based terrain shading so mountains read clearly on the dark basemap
    map.addSource('mapbox-dem', {
      type: 'raster-dem',
      url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
      tileSize: 512,
      maxzoom: 14,
    });
    map.addLayer({
      id: 'hillshade',
      type: 'hillshade',
      source: 'mapbox-dem',
      paint: {
        'hillshade-exaggeration':          0.4,
        'hillshade-shadow-color':          '#0a0e18',
        'hillshade-highlight-color':       '#c8d8e8',
        'hillshade-accent-color':          '#0a0e18',
        'hillshade-illumination-direction': 335,
      },
    });

    map.addSource('src-streams', { type: 'raster', tiles: [arcgisTile('7')], tileSize: 256 });
    map.addLayer({ id: 'mt-streams', type: 'raster', source: 'src-streams', paint: { 'raster-opacity': 0.2 } });

    dismissLoading();

    const [usgsResult, dnrcResult, snotelResult, basinsResult, riversResult, noaaResult, lakesResult, dnrcSnotelResult] =
      await Promise.allSettled([
        fetch('/data/usgs_gauges.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/dnrc_gauges.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/snotel_stations.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/mt_basins.geojson').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/mt_rivers.geojson').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/noaa_gauges.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/mt_lakes.geojson').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch('/data/dnrc_snotel_links.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      ]);

    const usgsData    = usgsResult.status       === 'fulfilled' ? usgsResult.value       : null;
    const dnrcData    = dnrcResult.status       === 'fulfilled' ? dnrcResult.value       : null;
    const snotelData  = snotelResult.status     === 'fulfilled' ? snotelResult.value     : null;
    const basinsData  = basinsResult.status     === 'fulfilled' ? basinsResult.value     : null;
    const riversData  = riversResult.status     === 'fulfilled' ? riversResult.value     : null;
    noaaMap           = noaaResult.status       === 'fulfilled' ? noaaResult.value       : {};
    const lakesData   = lakesResult.status      === 'fulfilled' ? lakesResult.value      : null;
    dnrcSnotelLinks   = dnrcSnotelResult.status === 'fulfilled' ? dnrcSnotelResult.value : {};
    if (snotelData) for (const f of snotelData.features) snotelFeaturesMap[f.properties.triplet] = f;

    document.getElementById('usgs-ct').textContent   = usgsData   ? usgsData.features.length   : '—';
    document.getElementById('dnrc-ct').textContent   = dnrcData   ? dnrcData.features.length   : '—';
    document.getElementById('snotel-ct').textContent = snotelData ? snotelData.features.length : '—';

    if (!usgsData && !dnrcData && !snotelData) {
      document.getElementById('gauge-count').textContent = 'Gauge data unavailable';
    }

    // HUC8 watershed polygons — dashed outlines, subtle fill, clearly visible on dark basemap
    if (basinsData) {
      map.addSource('mt-basins', { type: 'geojson', data: basinsData });
      // Basin outlines default hidden — toggle to show; minzoom 6 prevents state-level clutter
      map.addLayer({ id: 'mt-basins-fill', type: 'fill', source: 'mt-basins', minzoom: 6,
        layout: { visibility: 'none' },
        paint: {
          'fill-color': '#4a8fba',
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 6, 0.06, 10, 0.03],
        }});
      map.addLayer({ id: 'mt-basins-line', type: 'line', source: 'mt-basins', minzoom: 6,
        layout: { visibility: 'none' },
        paint: {
          'line-color': '#6ab0d8',
          'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.8, 10, 0.5],
          'line-opacity': ['interpolate', ['linear'], ['zoom'], 6, 0.6, 10, 0.35],
          'line-dasharray': [4, 3],
        }});
      // Upstream highlight overlay — always visible when data is set, sits above basin outlines
      map.addSource('basin-hl-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'basin-hl-fill', type: 'fill', source: 'basin-hl-src', paint: {
        'fill-color': '#4a8fba',
        'fill-opacity': ['case', ['has', 'hop'], ['interpolate', ['linear'], ['get', 'hop'], 0, 0.42, 8, 0.05], 0.18],
      }});
      map.addLayer({ id: 'basin-hl-line', type: 'line', source: 'basin-hl-src', paint: {
        'line-color': '#4a8fba',
        'line-width': ['interpolate', ['linear'], ['zoom'], 4, 1.4, 8, 0.9],
        'line-opacity': 0.9,
      }});
      // basins toggle stays OFF by default — no classList.add('on')
    }

    // Point-in-polygon helpers (ray casting) for upstream basin lookup
    function ptInRing(pt, ring) {
      let inside = false;
      const [px, py] = pt;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if (((yi > py) !== (yj > py)) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    function ptInFeature(pt, f) {
      const g = f.geometry;
      const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
      return polys.some(poly => ptInRing(pt, poly[0]) && !poly.slice(1).some(h => ptInRing(pt, h)));
    }
    // Build upstream lookup from HydroSHEDS pfaf_id/next_pfaf_id topology
    let _upstreamGraph = null;
    function buildUpstreamGraph(features) {
      // next_pfaf_id points downstream; invert to: pfaf_id → [upstream pfaf_ids, ...]
      const downTo = new Map();
      for (const f of features) {
        const { pfaf_id, next_pfaf_id } = f.properties;
        if (!pfaf_id || !next_pfaf_id) continue;
        if (!downTo.has(next_pfaf_id)) downTo.set(next_pfaf_id, []);
        downTo.get(next_pfaf_id).push(pfaf_id);
      }
      return downTo;
    }
    function getUpstreamSet(startPfafId) {
      if (!_upstreamGraph) _upstreamGraph = buildUpstreamGraph(basinsData.features);
      const visited = new Set();
      const queue = [startPfafId];
      while (queue.length) {
        const cur = queue.shift();
        if (visited.has(cur)) continue;
        visited.add(cur);
        const parents = _upstreamGraph.get(cur) || [];
        for (const p of parents) if (!visited.has(p)) queue.push(p);
      }
      return visited;
    }
    function highlightUpstreamBasins(coords) {
      if (!basinsData || !map.getSource('basin-hl-src')) return;
      const all = basinsData.features;
      const containing = all.find(f => ptInFeature(coords, f));
      if (!containing) { map.getSource('basin-hl-src').setData({ type: 'FeatureCollection', features: [] }); return; }
      const startPfafId = containing.properties.pfaf_id || '';
      const hasTopology = all.some(f => f.properties.next_pfaf_id);
      let upstream;
      if (hasTopology && startPfafId) {
        const upSet = getUpstreamSet(startPfafId);
        upstream = all.filter(f => upSet.has(f.properties.pfaf_id));
      } else {
        upstream = [containing];
      }
      map.getSource('basin-hl-src').setData({ type: 'FeatureCollection', features: upstream });
    }
    function clearBasinHighlight() {
      if (map.getSource('basin-hl-src')) map.getSource('basin-hl-src').setData({ type: 'FeatureCollection', features: [] });
    }
    window._clearBasinHighlight = clearBasinHighlight;

    function highlightDirectBasin(coords) {
      if (!basinsData || !map.getSource('basin-hl-src')) return;
      const containing = basinsData.features.find(f => ptInFeature(coords, f));
      if (!containing) { clearBasinHighlight(); return; }
      const feature = { ...containing, properties: { ...containing.properties, hop: 0 } };
      map.getSource('basin-hl-src').setData({ type: 'FeatureCollection', features: [feature] });
    }

    function highlightDownstreamPath(coords, maxHops) {
      if (!basinsData || !map.getSource('basin-hl-src')) return;
      maxHops = maxHops || 8;
      const all = basinsData.features;
      const containing = all.find(f => ptInFeature(coords, f));
      if (!containing) { clearBasinHighlight(); return; }

      const downMap = new Map();
      for (const f of all) {
        const p = f.properties.pfaf_id, n = f.properties.next_pfaf_id;
        if (p && n) downMap.set(p, n);
      }
      const pfafIndex = new Map(all.map(f => [f.properties.pfaf_id, f]));

      const highlighted = [];
      let cur = containing.properties.pfaf_id;
      for (let hop = 0; hop <= maxHops && cur; hop++) {
        const f = pfafIndex.get(cur);
        if (!f) break;
        highlighted.push({ ...f, properties: { ...f.properties, hop } });
        cur = downMap.get(cur);
        if (!cur) break;
      }
      map.getSource('basin-hl-src').setData({ type: 'FeatureCollection', features: highlighted });
    }

    // Named lakes — fill polygons below river lines
    if (lakesData) {
      map.addSource('mt-lakes', { type: 'geojson', data: lakesData });
      map.addLayer({ id: 'lakes-fill', type: 'fill', source: 'mt-lakes', paint: {
        'fill-color': '#2a6db5',
        'fill-opacity': 0.55,
      }});
      map.addLayer({ id: 'lakes-stroke', type: 'line', source: 'mt-lakes', paint: {
        'line-color': '#5cb8e0',
        'line-width': 0.5,
        'line-opacity': 0.7,
      }});
      const lakesToggle = document.getElementById('toggle-lakes');
      if (lakesToggle) lakesToggle.classList.add('on');
    }

    // OSM named rivers — width + color scale by discharge-proxy tier (1–5)
    // Tier 5 = Missouri/Yellowstone (200+ segments), Tier 1 = small named creeks
    if (riversData) {
      map.addSource('nhd-rivers', { type: 'geojson', data: riversData });
      map.addLayer({ id: 'nhd-rivers-line', type: 'line', source: 'nhd-rivers',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': ['match', ['get', 'tier'],
            5, '#7de0ff',
            4, '#5cb8e0',
            3, '#4a9fc8',
            2, '#3a87b0',
               '#2a6890',
          ],
          'line-width': ['interpolate', ['linear'], ['zoom'],
            4,  ['match', ['get', 'tier'], 5, 1.8, 4, 1.2, 3, 0.7, 2, 0.4, 0.2],
            7,  ['match', ['get', 'tier'], 5, 4.0, 4, 2.5, 3, 1.4, 2, 0.8, 0.4],
            10, ['match', ['get', 'tier'], 5, 8.0, 4, 5.0, 3, 2.8, 2, 1.5, 0.7],
            13, ['match', ['get', 'tier'], 5, 14.0, 4, 9.0, 3, 5.0, 2, 2.5, 1.2],
          ],
          'line-opacity': ['match', ['get', 'tier'], 5, 1.0, 4, 0.95, 3, 0.88, 2, 0.78, 0.55],
        },
      });
      // Raster stays as faint background texture; toggle controls both together
      const streamToggle = document.getElementById('toggle-streams');
      if (streamToggle) streamToggle.dataset.layers = 'mt-streams,nhd-rivers-line';

      map.on('click', 'nhd-rivers-line', e => {
        // Don't open river panel when the click also hit a gauge dot
        const gaugeHit = map.queryRenderedFeatures(e.point, { layers: ['usgs-points', 'dnrc-points', 'snotel-points'].filter(id => map.getLayer(id)) });
        if (gaugeHit.length > 0) return;
        const name = e.features[0]?.properties?.name;
        if (name && window._openRiverByName) window._openRiverByName(name);
      });
      map.on('mouseenter', 'nhd-rivers-line', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'nhd-rivers-line', () => { map.getCanvas().style.cursor = ''; });

      // River highlight overlay (sits above nhd-rivers-line, below gauge dots)
      map.addSource('river-hl-src', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'river-hl-line', type: 'line', source: 'river-hl-src',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: {
          'line-color': '#e8c060',
          'line-width': ['interpolate', ['linear'], ['zoom'], 4, 2.5, 8, 5, 12, 9],
          'line-opacity': 0.92,
          'line-blur': 1,
        },
      });

      function extractRiverName(gaugeName) {
        const s = (gaugeName || '').toLowerCase();
        const m = s.match(/^(.*?)\s+(?:at|nr|near|ab|bl|above|below|blw|div|diversion)\b/);
        return m ? m[1].trim() : s.replace(/,.*$/, '').replace(/\s+mt\s*$/, '').trim();
      }
      function highlightRiver(gaugeName) {
        if (!map.getSource('river-hl-src')) return;
        const query = extractRiverName(gaugeName);
        if (!query) { window._clearRiverHighlight && window._clearRiverHighlight(); return; }
        const features = riversData.features.filter(f => {
          const rname = (f.properties.name || '').toLowerCase();
          const q = query.toLowerCase();
          return rname === q || rname.startsWith(q + ' ') || q.startsWith(rname);
        });
        map.getSource('river-hl-src').setData({ type: 'FeatureCollection', features });
      }
      function clearRiverHighlight() {
        if (map.getSource('river-hl-src')) map.getSource('river-hl-src').setData({ type: 'FeatureCollection', features: [] });
      }
      window._clearRiverHighlight = clearRiverHighlight;
      window._highlightRiver = highlightRiver;
    }

    if (usgsData) {
      map.addSource('usgs-gauges', { type: 'geojson', data: usgsData });
      map.addLayer({
        id: 'usgs-points', type: 'circle', source: 'usgs-gauges',
        paint: {
          'circle-color': 'rgba(74,143,186,0.85)',
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 4, 10, 7],
          'circle-stroke-color': 'rgba(255,255,255,0.15)',
          'circle-stroke-width': 1,
        },
      });
      map.on('click', 'usgs-points', e => {
        selectStation('usgs', e.features[0]);
        if (window._highlightGauge) window._highlightGauge(e.features[0].properties.id);
        highlightUpstreamBasins(e.features[0].geometry.coordinates);
        if (window._highlightRiver) window._highlightRiver(e.features[0].properties.name);
      });
      map.on('mouseenter', 'usgs-points', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'usgs-points', () => { map.getCanvas().style.cursor = ''; });
    }

    if (dnrcData) {
      map.addSource('dnrc-gauges', { type: 'geojson', data: dnrcData });
      map.addLayer({
        id: 'dnrc-points', type: 'circle', source: 'dnrc-gauges', minzoom: 7,
        paint: {
          'circle-color': 'rgba(58,171,138,0.75)',
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 7, 3, 10, 6],
          'circle-stroke-color': 'rgba(255,255,255,0.12)',
          'circle-stroke-width': 1,
        },
      });
      map.on('click', 'dnrc-points', e => {
        const usgs = usgsData ? map.queryRenderedFeatures(e.point, { layers: ['usgs-points'] }) : [];
        if (!usgs.length) {
          selectStation('dnrc', e.features[0]);
          highlightDirectBasin(e.features[0].geometry.coordinates);
          if (window._highlightRiver) window._highlightRiver(e.features[0].properties.name);
        }
      });
      map.on('mouseenter', 'dnrc-points', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'dnrc-points', () => { map.getCanvas().style.cursor = ''; });
    }

    if (snotelData) {
      map.addSource('snotel-stations', { type: 'geojson', data: snotelData });
      map.addLayer({
        id: 'snotel-points', type: 'circle', source: 'snotel-stations',
        paint: {
          'circle-color': 'rgba(212,148,58,0.82)',
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 4.5, 10, 8],
          'circle-stroke-color': 'rgba(255,255,255,0.18)',
          'circle-stroke-width': 1.2,
        },
      });
      map.on('click', 'snotel-points', e => {
        const usgs = usgsData ? map.queryRenderedFeatures(e.point, { layers: ['usgs-points'] }) : [];
        if (!usgs.length) {
          selectStation('snotel', e.features[0]);
          if (window._highlightSnotel) window._highlightSnotel(e.features[0].properties.triplet);
          highlightDirectBasin(e.features[0].geometry.coordinates);
          if (window._clearRiverHighlight) window._clearRiverHighlight();
        }
      });
      map.on('mouseenter', 'snotel-points', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'snotel-points', () => { map.getCanvas().style.cursor = ''; });
    }

    // Click on empty space → close panel and clear all highlights
    map.on('click', e => {
      const interactive = ['usgs-points', 'dnrc-points', 'snotel-points', 'nhd-rivers-line'].filter(id => map.getLayer(id));
      const hit = map.queryRenderedFeatures(e.point, { layers: interactive });
      if (!hit.length) closePanel();
    });

    await loadHierarchy(usgsData, snotelData);
  } catch(e) {
    console.error('Map load error:', e);
    document.getElementById('gauge-count').textContent = 'Gauge data unavailable';
  }
});
</script>
</body>
</html>
