<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverLine — Montana River Conditions</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/shared/freshness.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --teal:    #3aab8a;
    --warn:    #c8973a;
    --danger:  #c05040;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--base); color: var(--text); font-family: var(--sans); }

  #map { position: absolute; inset: 0; }

  /* Nav */
  #nav {
    position: absolute;
    top: 16px; left: 16px;
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 180px;
  }
  #nav .wordmark { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); font-family: var(--sans); font-weight: 500; }
  #nav h1 { font-family: var(--serif); font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.1; margin: 2px 0 6px; }
  #nav .region { font-family: var(--mono); font-size: 11px; color: var(--accent); display: block; }
  #nav .subnav { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; display: flex; gap: 8px; }
  #nav .subnav a {
    font-size: 11px; font-weight: 500; color: var(--muted);
    text-decoration: none; padding: 3px 8px; border-radius: 5px;
    border: 1px solid var(--border); transition: color 0.15s, border-color 0.15s;
  }
  #nav .subnav a:hover { color: var(--text); border-color: var(--accent); }

  /* Layer controls */
  #layer-controls {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 10;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 155px;
  }
  #layer-controls .ctrl-label { font-size: 10px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; margin-bottom: 2px; }
  .layer-toggle {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
    padding: 4px 6px; border-radius: 6px;
    transition: background 0.15s;
  }
  .layer-toggle:hover { background: var(--dim); }
  .layer-toggle .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; opacity: 0.3; transition: opacity 0.15s; }
  .layer-toggle.on .dot { opacity: 1; }
  .layer-toggle span { font-size: 12px; color: var(--text); font-weight: 400; opacity: 0.55; transition: opacity 0.15s; }
  .layer-toggle.on span { opacity: 1; }

  /* Legend */
  #legend {
    position: absolute; bottom: 24px; left: 16px; z-index: 10;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  #legend .leg-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  #legend .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Count badge */
  #gauge-count {
    position: absolute; bottom: 24px; right: 16px; z-index: 10;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  #gauge-count span { color: var(--text); }

  /* Side panel */
  #panel {
    position: absolute; top: 0; right: -400px;
    width: 360px; height: 100%;
    z-index: 20;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  #panel.open { right: 0; }
  #panel-header {
    padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .source-badge {
    font-size: 9px; font-family: var(--mono); font-weight: 600;
    letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0; margin-top: 3px;
  }
  .badge-usgs { background: rgba(74,143,186,0.2); color: var(--accent); border: 1px solid rgba(74,143,186,0.3); }
  .badge-dnrc { background: rgba(58,171,138,0.2); color: var(--teal); border: 1px solid rgba(58,171,138,0.3); }
  .title-block { flex: 1; min-width: 0; }
  .gauge-name { font-family: var(--serif); font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .gauge-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  #panel-close {
    background: none; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
    border-radius: 4px; transition: color 0.15s;
  }
  #panel-close:hover { color: var(--text); }

  #panel-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #panel-body::-webkit-scrollbar { width: 4px; }
  #panel-body::-webkit-scrollbar-track { background: transparent; }
  #panel-body::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  .cfs-hero { text-align: center; padding: 12px 0; }
  .cfs-value { font-family: var(--mono); font-size: 56px; font-weight: 600; color: var(--text); line-height: 1; }
  .cfs-unit { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .cfs-ts { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; }
  .cfs-loading { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 20px 0; }

  .section-label { font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--accent); margin-bottom: 8px; }
  .chart-wrap { height: 120px; position: relative; }

  .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-row .lbl { font-size: 12px; color: var(--muted); }
  .info-row .val { font-family: var(--mono); font-size: 12px; color: var(--text); text-align: right; }

  .ext-link { text-align: center; margin-top: 4px; }
  .ext-link a {
    font-size: 12px; color: var(--accent); text-decoration: none;
    border: 1px solid rgba(74,143,186,0.3); border-radius: 6px;
    padding: 6px 14px; display: inline-block;
    transition: background 0.15s, border-color 0.15s;
  }
  .ext-link a:hover { background: rgba(74,143,186,0.1); border-color: var(--accent); }

  /* Mapbox overrides */
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { display: none !important; }
  .mapboxgl-ctrl-group { background: var(--surface) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; box-shadow: none !important; }
  .mapboxgl-ctrl-group button { background: transparent !important; }
  .mapboxgl-ctrl-group button + button { border-top: 1px solid var(--border) !important; }
  .mapboxgl-ctrl-group button .mapboxgl-ctrl-icon { filter: invert(1) brightness(0.6); }

  /* Loading overlay */
  #loading {
    position: absolute; inset: 0; z-index: 30;
    background: var(--base); display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .load-text { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .spinner {
    width: 24px; height: 24px; border: 2px solid var(--dim);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="load-text">Loading gauges…</div>
</div>

<div id="map"></div>

<div id="nav">
  <div class="wordmark">itogeospatial</div>
  <h1>River Conditions</h1>
  <span class="region">Montana</span>
  <div class="subnav">
    <a href="/gallatin/">Gallatin</a>
  </div>
</div>

<div id="layer-controls">
  <div class="ctrl-label">LAYERS</div>
  <div class="layer-toggle on" id="toggle-usgs" data-layers="usgs-clusters,usgs-cluster-count,usgs-points">
    <div class="dot" style="background:var(--accent)"></div>
    <span>USGS gauges</span>
  </div>
  <div class="layer-toggle on" id="toggle-dnrc" data-layers="dnrc-points">
    <div class="dot" style="background:var(--teal)"></div>
    <span>DNRC gauges</span>
  </div>
  <div class="layer-toggle on" id="toggle-streams" data-layers="mt-streams">
    <div class="dot" style="background:#5b8db8; border-radius:1px; height:3px; width:14px;"></div>
    <span>MT streams</span>
  </div>
  <div class="layer-toggle" id="toggle-basins" data-layers="huc8-basins">
    <div class="dot" style="background:var(--muted); border-radius:1px;"></div>
    <span>HUC8 basins</span>
  </div>
</div>

<div id="legend">
  <div class="leg-row"><div class="leg-dot" style="background:var(--accent)"></div>USGS stream gauge</div>
  <div class="leg-row"><div class="leg-dot" style="background:var(--teal)"></div>DNRC stage gauge</div>
</div>

<div id="gauge-count">
  <span id="usgs-ct">—</span> USGS · <span id="dnrc-ct">—</span> DNRC
</div>

<div id="panel">
  <div id="panel-header">
    <span class="source-badge badge-usgs" id="panel-badge">USGS</span>
    <div class="title-block">
      <div class="gauge-name" id="panel-name">—</div>
      <div class="gauge-sub" id="panel-id">—</div>
    </div>
    <button id="panel-close" title="Close">×</button>
  </div>
  <div id="panel-body">
    <div class="cfs-hero" id="cfs-hero"><div class="cfs-loading">Loading…</div></div>
    <div id="chart-section" style="display:none">
      <div class="section-label">7-Day Flow</div>
      <div class="chart-wrap"><canvas id="flow-chart"></canvas></div>
    </div>
    <div id="info-section"></div>
    <div class="ext-link" id="ext-link"></div>
  </div>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiaXRvZ2VvIiwiYSI6ImNta3ByYnA1bzBsYW0zZG9mMnMxdWZwMjUifQ.Q7pwAuAEKdBHD_dqaVBhvw';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [-109.5, 47.0],
  zoom: 5.2,
  minZoom: 4,
  maxZoom: 16,
});
map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

const DNRC_BASE = 'https://gis.dnrc.mt.gov/arcgis/rest/services/WRD/WMB_StAGE/MapServer/export';
function arcgisTile(layerIds) {
  return `${DNRC_BASE}?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&layers=show:${layerIds}&size=256,256&f=image&format=png32&transparent=true&dpi=96`;
}

let flowChart = null;

const panel     = document.getElementById('panel');
const panelName = document.getElementById('panel-name');
const panelId   = document.getElementById('panel-id');
const panelBadge = document.getElementById('panel-badge');
const cfsHero   = document.getElementById('cfs-hero');
const chartSection = document.getElementById('chart-section');
const infoSection  = document.getElementById('info-section');
const extLink      = document.getElementById('ext-link');

document.getElementById('panel-close').addEventListener('click', closePanel);
function closePanel() {
  panel.classList.remove('open');
  if (flowChart) { flowChart.destroy(); flowChart = null; }
}

function openPanel(name, id, badgeClass) {
  if (flowChart) { flowChart.destroy(); flowChart = null; }
  panelName.textContent = name;
  panelId.textContent = id;
  panelBadge.className = 'source-badge ' + badgeClass;
  panelBadge.textContent = badgeClass.includes('usgs') ? 'USGS' : 'DNRC';
  cfsHero.innerHTML = '<div class="cfs-loading">Loading…</div>';
  chartSection.style.display = 'none';
  infoSection.innerHTML = '';
  extLink.innerHTML = '';
  panel.classList.add('open');
}

async function openUsgsPanel(feature) {
  const { id, name } = feature.properties;
  openPanel(name, id, 'badge-usgs');
  try {
    const url = `https://waterservices.usgs.gov/nwis/iv/?sites=${id}&parameterCd=00060,00065&format=json&period=P7D`;
    const data = await fetch(url).then(r => r.json());
    const series = data?.value?.timeSeries || [];
    const flowSeries  = series.find(s => s.variable?.variableCode?.[0]?.value === '00060');
    const stageSeries = series.find(s => s.variable?.variableCode?.[0]?.value === '00065');

    if (!flowSeries) {
      cfsHero.innerHTML = '<div class="cfs-loading">No streamflow data</div>';
    } else {
      const vals = flowSeries.values?.[0]?.value || [];
      const current = vals[vals.length - 1];
      const cfs = current ? parseFloat(current.value) : null;
      const ts  = current?.dateTime || null;
      if (cfs !== null && !isNaN(cfs)) {
        cfsHero.innerHTML = `
          <div class="cfs-value">${cfs.toLocaleString()}</div>
          <div class="cfs-unit">cubic feet per second</div>
          <div class="cfs-ts">${ts ? formatTimestampMT(ts) : ''}</div>`;
      } else {
        cfsHero.innerHTML = '<div class="cfs-loading">No current reading</div>';
      }

      if (vals.length > 1) {
        const step = Math.max(1, Math.floor(vals.length / 96));
        const sampled = vals.filter((_, i) => i % step === 0);
        chartSection.style.display = '';
        const ctx = document.getElementById('flow-chart').getContext('2d');
        flowChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: sampled.map(v => v.dateTime.slice(5, 10)),
            datasets: [{
              data: sampled.map(v => parseFloat(v.value)),
              borderColor: 'rgba(74,143,186,0.85)', borderWidth: 1.5,
              fill: true, backgroundColor: 'rgba(74,143,186,0.08)',
              pointRadius: 0, tension: 0.2,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: { label: c => c.parsed.y.toLocaleString() + ' cfs' },
                backgroundColor: 'rgba(14,28,45,0.95)', titleColor: '#455a70',
                bodyColor: '#d4dde8', borderColor: '#1a2f45', borderWidth: 1,
              },
            },
            scales: {
              x: { display: false },
              y: {
                ticks: { color: '#455a70', font: { family: 'JetBrains Mono', size: 10 },
                  callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v },
                grid: { color: 'rgba(255,255,255,0.04)' },
                border: { display: false },
              },
            },
          },
        });
      }
    }

    const rows = [];
    const stageVals = stageSeries?.values?.[0]?.value || [];
    const stageVal = stageVals[stageVals.length - 1];
    const stageFt = stageVal ? parseFloat(stageVal.value) : null;
    if (stageFt !== null && !isNaN(stageFt)) rows.push({ lbl: 'Gage height', val: stageFt.toFixed(2) + ' ft' });
    rows.push({ lbl: 'Site ID', val: id });
    infoSection.innerHTML = rows.map(r =>
      `<div class="info-row"><span class="lbl">${r.lbl}</span><span class="val">${r.val}</span></div>`
    ).join('');
    extLink.innerHTML = `<a href="https://waterdata.usgs.gov/monitoring-location/${id}/" target="_blank" rel="noopener">USGS Water Data ↗</a>`;
  } catch(e) {
    cfsHero.innerHTML = '<div class="cfs-loading">Fetch error</div>';
    extLink.innerHTML = `<a href="https://waterdata.usgs.gov/monitoring-location/${id}/" target="_blank" rel="noopener">USGS Water Data ↗</a>`;
  }
}

function openDnrcPanel(feature) {
  const { id, name, county, basin } = feature.properties;
  openPanel(name, id, 'badge-dnrc');
  cfsHero.innerHTML = '';
  const rows = [];
  if (basin) rows.push({ lbl: 'Basin', val: basin });
  if (county) rows.push({ lbl: 'County', val: county });
  rows.push({ lbl: 'Source', val: 'DNRC StAGE' });
  infoSection.innerHTML = rows.map(r =>
    `<div class="info-row"><span class="lbl">${r.lbl}</span><span class="val">${r.val}</span></div>`
  ).join('');
  extLink.innerHTML = `<a href="https://gis.dnrc.mt.gov/apps/stage/gage-report/location/${id}" target="_blank" rel="noopener">DNRC StAGE ↗</a>`;
}

document.querySelectorAll('.layer-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const on = btn.classList.toggle('on');
    btn.dataset.layers.split(',').forEach(lid => {
      if (map.getLayer(lid)) map.setLayoutProperty(lid, 'visibility', on ? 'visible' : 'none');
    });
  });
});

map.on('load', async () => {
  map.addSource('src-streams', { type: 'raster', tiles: [arcgisTile('7')], tileSize: 256 });
  map.addSource('src-basins',  { type: 'raster', tiles: [arcgisTile('11')], tileSize: 256 });
  map.addLayer({ id: 'mt-streams', type: 'raster', source: 'src-streams', paint: { 'raster-opacity': 0.5 } });
  map.addLayer({ id: 'huc8-basins', type: 'raster', source: 'src-basins', paint: { 'raster-opacity': 0.35 }, layout: { visibility: 'none' } });

  const [usgsData, dnrcData] = await Promise.all([
    fetch('/data/usgs_gauges.json').then(r => r.json()),
    fetch('/data/dnrc_gauges.json').then(r => r.json()),
  ]);

  document.getElementById('usgs-ct').textContent = usgsData.features.length;
  document.getElementById('dnrc-ct').textContent = dnrcData.features.length;

  map.addSource('usgs-gauges', {
    type: 'geojson', data: usgsData,
    cluster: true, clusterMaxZoom: 9, clusterRadius: 40,
  });
  map.addLayer({
    id: 'usgs-clusters', type: 'circle', source: 'usgs-gauges',
    filter: ['has', 'point_count'],
    paint: {
      'circle-color': 'rgba(74,143,186,0.25)',
      'circle-stroke-color': 'rgba(74,143,186,0.65)',
      'circle-stroke-width': 1.5,
      'circle-radius': ['step', ['get', 'point_count'], 16, 10, 22, 30, 28],
    },
  });
  map.addLayer({
    id: 'usgs-cluster-count', type: 'symbol', source: 'usgs-gauges',
    filter: ['has', 'point_count'],
    layout: {
      'text-field': '{point_count_abbreviated}',
      'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
      'text-size': 11,
    },
    paint: { 'text-color': 'rgba(74,143,186,0.95)' },
  });
  map.addLayer({
    id: 'usgs-points', type: 'circle', source: 'usgs-gauges',
    filter: ['!', ['has', 'point_count']],
    paint: {
      'circle-color': 'rgba(74,143,186,0.85)',
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 4, 10, 7],
      'circle-stroke-color': 'rgba(255,255,255,0.15)',
      'circle-stroke-width': 1,
    },
  });

  map.addSource('dnrc-gauges', { type: 'geojson', data: dnrcData });
  map.addLayer({
    id: 'dnrc-points', type: 'circle', source: 'dnrc-gauges',
    paint: {
      'circle-color': 'rgba(58,171,138,0.75)',
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 3.5, 10, 6],
      'circle-stroke-color': 'rgba(255,255,255,0.12)',
      'circle-stroke-width': 1,
    },
  });

  map.on('click', 'usgs-clusters', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['usgs-clusters'] })[0];
    map.getSource('usgs-gauges').getClusterExpansionZoom(f.properties.cluster_id, (err, zoom) => {
      if (!err) map.easeTo({ center: f.geometry.coordinates, zoom, duration: 300 });
    });
  });
  map.on('click', 'usgs-points', e => { openUsgsPanel(e.features[0]); });
  map.on('click', 'dnrc-points', e => {
    const usgs = map.queryRenderedFeatures(e.point, { layers: ['usgs-points'] });
    if (!usgs.length) openDnrcPanel(e.features[0]);
  });

  ['usgs-clusters','usgs-points','dnrc-points'].forEach(id => {
    map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
  });

  document.getElementById('loading').classList.add('hidden');
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 400);
});
</script>
</body>
</html>
