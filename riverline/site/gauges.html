<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverLine — Montana Gauges</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
    --nav-h:   44px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--base); }
  body { font-family: var(--sans); background: var(--base); color: var(--text); padding-top: var(--nav-h); }

  /* ── Nav ─────────────────────────────────────────────────────────── */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 200;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
  }
  .nav-brand { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: lowercase; white-space: nowrap; }
  .nav-sep { color: var(--dim); font-size: 12px; }
  .nav-links { display: flex; gap: 2px; }
  .nav-links a { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 4px; text-decoration: none; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
  .nav-links a:hover { background: rgba(74,143,186,0.1); color: var(--accent); }
  .nav-links a.active { background: rgba(74,143,186,0.12); color: var(--accent); }

  /* ── Loading overlay ─────────────────────────────────────────────── */
  #loading-overlay {
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 100;
    background: var(--base); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    transition: opacity 0.3s;
  }
  #loading-overlay.fade { opacity: 0; pointer-events: none; }

  /* ── Overview map ────────────────────────────────────────────────── */
  #overview-map {
    height: 240px; width: 100%; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { display: none !important; }

  /* ── Page body ───────────────────────────────────────────────────── */
  .page-body { max-width: 1300px; margin: 0 auto; padding: 0 16px 60px; }

  .page-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .search-box {
    flex: 1; max-width: 320px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 7px 11px; font-family: var(--mono); font-size: 11px;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }
  #gauge-stats { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }

  /* ── River section ───────────────────────────────────────────────── */
  .river-section { margin-top: 20px; }
  .river-section.hidden { display: none; }
  .river-section-header {
    display: flex; align-items: baseline; gap: 10px;
    padding: 5px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
  }
  .river-section-name {
    font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--accent);
  }
  .river-section-count { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  /* ── Gauge grid ──────────────────────────────────────────────────── */
  .gauge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 10px;
  }

  /* ── Gauge card ──────────────────────────────────────────────────── */
  .gauge-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .gauge-card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 10px 14px 8px; border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .gauge-card-left { flex: 1; min-width: 0; }
  .gauge-card-name {
    font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--text);
    line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gauge-card-id { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 2px; }
  .gauge-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .gauge-card-cfs { font-family: var(--mono); font-size: 20px; font-weight: 700; line-height: 1; }
  .gauge-card-unit { font-family: var(--sans); font-size: 10px; color: var(--muted); margin-left: 2px; }
  .gauge-card-cls {
    font-family: var(--mono); font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.4px; padding: 2px 7px; border-radius: 3px;
  }

  /* ── Chart container ─────────────────────────────────────────────── */
  .chart-container { position: relative; height: 160px; }
  .chart-placeholder {
    position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: var(--surface);
  }
  .chart-placeholder.hidden { display: none; }

  /* ── Card footer ─────────────────────────────────────────────────── */
  .gauge-card-footer {
    display: flex; align-items: center; gap: 8px; padding: 5px 14px;
    border-top: 1px solid var(--border); background: rgba(0,0,0,0.12);
  }
  .gauge-card-link {
    font-family: var(--mono); font-size: 9px; color: var(--muted); text-decoration: none;
    transition: color 0.15s;
  }
  .gauge-card-link:hover { color: var(--accent); }
  .gauge-card-ts { font-family: var(--mono); font-size: 9px; color: var(--dim); margin-left: auto; }

  /* ── Legend strip ────────────────────────────────────────────────── */
  .chart-legend {
    display: flex; gap: 14px; padding: 4px 14px 6px;
    border-bottom: 1px solid var(--border);
  }
  .chart-legend-item { display: flex; align-items: center; gap: 5px; }
  .chart-legend-swatch { width: 20px; height: 8px; border-radius: 2px; }
  .chart-legend-label { font-family: var(--mono); font-size: 9px; color: var(--muted); }

  /* ── Mobile ──────────────────────────────────────────────────────── */
  @media (max-width: 620px) {
    .gauge-grid { grid-template-columns: 1fr; }
    #overview-map { height: 180px; }
    .page-toolbar { flex-wrap: wrap; }
    .search-box { max-width: 100%; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <span class="nav-brand">itogeospatial</span>
  <div class="nav-links">
    <a href="/snow">Snow</a>
    <a href="/river" class="active">River</a>
  </div>
  <span class="nav-sep">/</span>
  <div class="nav-links">
    <a href="/river/">Map</a>
    <a href="/river/gauges" class="active">Gauges</a>
  </div>
</nav>

<div id="loading-overlay">Loading Montana gauges…</div>

<div id="overview-map"></div>

<div class="page-body">
  <div class="page-toolbar">
    <input type="search" class="search-box" id="search-box" placeholder="Search rivers or gauges…" autocomplete="off">
    <div id="gauge-stats">Loading…</div>
  </div>
  <div id="river-sections"></div>
</div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiaXRvZ2VvIiwiYSI6ImNta3ByYnA1bzBsYW0zZG9mMnMxdWZwMjUifQ.Q7pwAuAEKdBHD_dqaVBhvw';

const CLS_COLOR = { 1:'#c05040', 2:'#c8973a', 3:'#4a8fba', 4:'#4aabba', 5:'#4a5fba' };
const CLS_LABEL = { 1:'Much Below Normal', 2:'Below Normal', 3:'Normal', 4:'Above Normal', 5:'Much Above Normal' };
const NO_DATA_COLOR = '#455a70';
const WY_START = '2025-10-01';
const WY_MONTHS = [
  {m:10,days:31},{m:11,days:30},{m:12,days:31},
  {m:1,days:31},{m:2,days:28},{m:3,days:31},
  {m:4,days:30},{m:5,days:31},{m:6,days:30},
  {m:7,days:31},{m:8,days:31},{m:9,days:30},
];
const MONTH_ABBR = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function clsColor(cls) { return CLS_COLOR[cls] || NO_DATA_COLOR; }
function clsLabel(cls) { return CLS_LABEL[cls] || 'No Data'; }
function fmtCfs(v) {
  if (v == null || v === '' || isNaN(Number(v))) return null;
  const n = Number(v);
  if (n < 0) return null;
  return n >= 10000 ? (n/1000).toFixed(0)+'k' : n >= 1000 ? (n/1000).toFixed(1)+'k' : n.toFixed(0);
}
function parseStat(s) { const v = parseFloat(s); return isNaN(v) ? null : v; }

let liveMap = {};
let hierarchyData = [];
let overviewMap = null;
let chartObserver = null;

// Caches keyed by siteId — persist across filter rebuilds
const dvCache = new Map();
const statsCache = new Map();

async function loadData() {
  const [hierResp, liveResp] = await Promise.allSettled([
    fetch('/river/data/river_hierarchy.json'),
    fetch('/river/api/gauges/mt'),
  ]);

  if (hierResp.status === 'fulfilled' && hierResp.value.ok) {
    const j = await hierResp.value.json();
    hierarchyData = j.rivers || [];
  } else {
    document.getElementById('loading-overlay').textContent = 'Failed to load gauge data.';
    return;
  }

  if (liveResp.status === 'fulfilled' && liveResp.value.ok) {
    const geo = await liveResp.value.json();
    for (const f of (geo.features || [])) {
      const p = f.properties;
      liveMap[p.id] = { flow: p.flow, ts: p.ts, cls: p.cls };
    }
  }

  const total = hierarchyData.reduce((s, r) => s + r.gauges.length, 0);
  const reporting = Object.values(liveMap).filter(v => v.flow != null).length;
  document.getElementById('gauge-stats').textContent =
    `${hierarchyData.length} rivers · ${total} gauges · ${reporting} reporting`;

  buildPage();
  initMap();
  setupObserver();

  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('fade');
  setTimeout(() => overlay.remove(), 350);
}

// ── Page builder ───────────────────────────────────────────────────
function buildPage(filter) {
  const q = (filter || '').trim().toLowerCase();
  const container = document.getElementById('river-sections');
  container.innerHTML = '';

  for (const river of hierarchyData) {
    const rLow = river.name.toLowerCase();
    const gauges = q
      ? river.gauges.filter(g => g.name.toLowerCase().includes(q) || rLow.includes(q))
      : river.gauges;
    if (gauges.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'river-section';

    const hdr = document.createElement('div');
    hdr.className = 'river-section-header';
    hdr.innerHTML = `
      <span class="river-section-name">${river.name}</span>
      <span class="river-section-count">${gauges.length} gauge${gauges.length !== 1 ? 's' : ''}</span>`;
    section.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'gauge-grid';

    for (const gauge of gauges) {
      const live = liveMap[gauge.id] || {};
      const color = clsColor(live.cls);
      const cfsStr = fmtCfs(live.flow);
      const ts = live.ts ? live.ts.slice(0, 10) : null;

      const card = document.createElement('div');
      card.className = 'gauge-card';
      card.id = `gauge-${gauge.id}`;

      // Head
      card.innerHTML = `
        <div class="gauge-card-head">
          <div class="gauge-card-left">
            <div class="gauge-card-name" title="${gauge.name}">${gauge.name}</div>
            <div class="gauge-card-id">${gauge.id}</div>
          </div>
          <div class="gauge-card-right">
            <div>
              <span class="gauge-card-cfs" style="color:${cfsStr ? color : NO_DATA_COLOR}">${cfsStr || '—'}</span>
              <span class="gauge-card-unit">cfs</span>
            </div>
            <div class="gauge-card-cls" style="background:${color}1a;color:${color}">${clsLabel(live.cls)}</div>
          </div>
        </div>
        <div class="chart-legend">
          <div class="chart-legend-item">
            <div class="chart-legend-swatch" style="background:rgba(74,143,186,0.25)"></div>
            <span class="chart-legend-label">P75–P90</span>
          </div>
          <div class="chart-legend-item">
            <div class="chart-legend-swatch" style="background:rgba(34,197,94,0.18)"></div>
            <span class="chart-legend-label">P25–P75</span>
          </div>
          <div class="chart-legend-item">
            <div class="chart-legend-swatch" style="background:rgba(245,158,11,0.2)"></div>
            <span class="chart-legend-label">P10–P25</span>
          </div>
          <div class="chart-legend-item">
            <div class="chart-legend-swatch" style="background:${color};height:3px;border-radius:1px"></div>
            <span class="chart-legend-label">WY 2026</span>
          </div>
        </div>
        <div class="chart-container" data-site-id="${gauge.id}" data-cls="${live.cls || 0}" data-loaded="false">
          <canvas></canvas>
          <div class="chart-placeholder">Loading chart…</div>
        </div>
        <div class="gauge-card-footer">
          <a class="gauge-card-link" href="https://waterdata.usgs.gov/monitoring-location/${gauge.id}/" target="_blank" rel="noopener">USGS ↗</a>
          <a class="gauge-card-link" href="https://waterdata.usgs.gov/nwis/uv?site_no=${gauge.id}" target="_blank" rel="noopener">Live ↗</a>
          ${ts ? `<span class="gauge-card-ts">as of ${ts}</span>` : ''}
        </div>`;

      grid.appendChild(card);
    }

    section.appendChild(grid);
    container.appendChild(section);
  }

  // Observe newly created containers
  if (chartObserver) {
    document.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
      chartObserver.observe(el);
    });
  }
}

// ── IntersectionObserver ───────────────────────────────────────────
function setupObserver() {
  chartObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const c = entry.target;
      if (c.dataset.loaded !== 'false') continue;
      c.dataset.loaded = 'loading';
      chartObserver.unobserve(c);
      loadGaugeChart(c);
    }
  }, { rootMargin: '500px' });

  document.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
    chartObserver.observe(el);
  });
}

// ── Chart loader ───────────────────────────────────────────────────
async function loadGaugeChart(container) {
  const siteId = container.dataset.siteId;
  const cls = parseInt(container.dataset.cls) || 0;
  const lineColor = CLS_COLOR[cls] || '#4a8fba';
  const canvas = container.querySelector('canvas');
  const placeholder = container.querySelector('.chart-placeholder');

  try {
    // Parallel fetch DV + stats, using cache when available
    const dvP = dvCache.has(siteId)
      ? Promise.resolve(dvCache.get(siteId))
      : fetch(`https://waterservices.usgs.gov/nwis/dv/?sites=${siteId}&parameterCd=00060&startDT=${WY_START}&format=json`)
          .then(r => r.ok ? r.json() : null).catch(() => null);

    const statsP = statsCache.has(siteId)
      ? Promise.resolve(statsCache.get(siteId))
      : fetch(`https://waterservices.usgs.gov/nwis/stat/?format=rdb&sites=${siteId}&parameterCd=00060&statReportType=daily&statType=p10,p25,p50,p75,p90`)
          .then(r => r.ok ? r.text() : null).catch(() => null);

    const [dvData, statsText] = await Promise.all([dvP, statsP]);

    if (!dvCache.has(siteId)) dvCache.set(siteId, dvData);
    if (!statsCache.has(siteId)) statsCache.set(siteId, statsText);

    // Parse stats RDB → doyMap: 'MM-DD' → {p10,p25,p50,p75,p90}
    const doyMap = new Map();
    if (statsText) {
      const lines = statsText.split('\n').filter(l => l && !l.startsWith('#'));
      const headers = lines[0]?.split('\t').map(h => h.trim()) || [];
      for (const line of lines.slice(2)) {
        const cols = line.split('\t');
        if (cols.length < headers.length) continue;
        const row = Object.fromEntries(headers.map((h, i) => [h, cols[i]]));
        const m = (row.month_nu || '').padStart(2, '0');
        const d = (row.day_nu  || '').padStart(2, '0');
        if (!m || !d || isNaN(parseInt(m, 10))) continue;
        doyMap.set(`${m}-${d}`, {
          p10: parseStat(row.p10_va),
          p25: parseStat(row.p25_va),
          p50: parseStat(row.p50_va),
          p75: parseStat(row.p75_va),
          p90: parseStat(row.p90_va),
        });
      }
    }

    // Parse DV JSON → flowMap: 'YYYY-MM-DD' → cfs
    const flowMap = new Map();
    if (dvData) {
      const series = dvData?.value?.timeSeries || [];
      const fs = series.find(s => s.variable?.variableCode?.[0]?.value === '00060');
      for (const v of (fs?.values?.[0]?.value || [])) {
        const fl = parseFloat(v.value);
        if (!isNaN(fl) && fl >= 0) flowMap.set(v.dateTime.slice(0, 10), fl);
      }
    }

    // Build water-year date spine from Oct 1, 2025 through today
    const todayStr = new Date().toISOString().slice(0, 10);
    const labels = [], p10 = [], p25 = [], p50 = [], p75 = [], p90 = [], actual = [];

    for (const {m, days: md} of WY_MONTHS) {
      for (let day = 1; day <= md; day++) {
        const mStr = String(m).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const yr = m >= 10 ? 2025 : 2026;
        const dateStr = `${yr}-${mStr}-${dStr}`;
        if (dateStr > todayStr) continue;

        labels.push(day === 1 ? MONTH_ABBR[m] : '');

        const stats = doyMap.get(`${mStr}-${dStr}`) || {};
        p10.push(stats.p10 ?? null);
        p25.push(stats.p25 ?? null);
        p50.push(stats.p50 ?? null);
        p75.push(stats.p75 ?? null);
        p90.push(stats.p90 ?? null);
        actual.push(flowMap.get(dateStr) ?? null);
      }
    }

    const hasStats = doyMap.size > 0;
    const hasActual = actual.some(v => v != null);

    if (!hasStats && !hasActual) {
      placeholder.textContent = 'No data available';
      container.dataset.loaded = 'empty';
      return;
    }

    placeholder.classList.add('hidden');

    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [
        // ── Percentile bands ──────────────────────────────────────────
        // P90 → fill to P75 (idx+1): above-normal zone (blue)
        { data: p90, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(74,143,186,0.18)', pointRadius: 0, tension: 0.3, spanGaps: true },
        // P75 → fill to P25 (idx+1): normal zone (green)
        { data: p75, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(34,197,94,0.12)', pointRadius: 0, tension: 0.3, spanGaps: true },
        // P25 → fill to P10 (idx+1): below-normal zone (amber)
        { data: p25, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(245,158,11,0.14)', pointRadius: 0, tension: 0.3, spanGaps: true },
        // P10 floor — no fill
        { data: p10, borderColor: 'transparent', fill: false, pointRadius: 0, tension: 0.3, spanGaps: true },
        // P50 dashed median
        { data: p50, borderColor: 'rgba(74,143,186,0.32)', borderWidth: 1, borderDash: [3, 2], fill: false, pointRadius: 0, tension: 0.3, spanGaps: true },
        // ── Current water year ────────────────────────────────────────
        { data: actual, borderColor: lineColor, borderWidth: 2, fill: false, pointRadius: 0, tension: 0.2, spanGaps: false },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            filter: item => item.datasetIndex >= 4,
            backgroundColor: 'rgba(14,28,45,0.95)',
            titleColor: '#455a70', bodyColor: '#d4dde8',
            borderColor: '#1a2f45', borderWidth: 1,
            padding: 8,
            titleFont: { family: "'JetBrains Mono', monospace", size: 9 },
            bodyFont: { family: "'JetBrains Mono', monospace", size: 10, weight: '600' },
            callbacks: {
              label: ctx => {
                if (ctx.parsed.y == null) return '';
                const v = ctx.parsed.y;
                const s = v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0);
                return ctx.datasetIndex === 4 ? `Median  ${s} cfs` : `Flow    ${s} cfs`;
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: '#455a70', font: { family: "'JetBrains Mono', monospace", size: 8 },
              maxTicksLimit: 13, maxRotation: 0, autoSkip: true,
            },
            grid: { color: 'rgba(255,255,255,0.025)' },
            border: { color: '#1a2f45' },
          },
          y: {
            ticks: {
              color: '#455a70', font: { family: "'JetBrains Mono', monospace", size: 8 },
              maxTicksLimit: 5,
              callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v,
            },
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { color: '#1a2f45' },
          },
        },
      },
    });

    container.dataset.loaded = 'done';
  } catch(e) {
    placeholder.textContent = 'Chart unavailable';
    container.dataset.loaded = 'error';
  }
}

// ── Mapbox overview mini-map ───────────────────────────────────────
function initMap() {
  overviewMap = new mapboxgl.Map({
    container: 'overview-map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [-109.5, 47.0],
    zoom: 4.8,
    scrollZoom: false,
    doubleClickZoom: false,
    touchZoomRotate: false,
  });
  overviewMap.dragRotate.disable();

  overviewMap.on('load', () => {
    const features = [];
    for (const river of hierarchyData) {
      for (const gauge of river.gauges) {
        if (!gauge.coords || gauge.coords.length < 2) continue;
        const live = liveMap[gauge.id] || {};
        features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: gauge.coords },
          properties: { id: gauge.id, name: gauge.name, color: clsColor(live.cls) },
        });
      }
    }

    overviewMap.addSource('gauges', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features },
    });
    overviewMap.addLayer({
      id: 'gauge-dots',
      type: 'circle',
      source: 'gauges',
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 4, 8, 7],
        'circle-color': ['get', 'color'],
        'circle-opacity': 0.85,
        'circle-stroke-width': 1,
        'circle-stroke-color': 'rgba(0,0,0,0.35)',
      },
    });

    // Click dot → scroll to gauge card
    overviewMap.on('click', 'gauge-dots', e => {
      const id = e.features[0]?.properties?.id;
      if (!id) return;
      const el = document.getElementById(`gauge-${id}`);
      if (!el) return;
      const y = el.getBoundingClientRect().top + window.scrollY - 60;
      window.scrollTo({ top: y, behavior: 'smooth' });
    });

    overviewMap.on('mouseenter', 'gauge-dots', () => {
      overviewMap.getCanvas().style.cursor = 'pointer';
    });
    overviewMap.on('mouseleave', 'gauge-dots', () => {
      overviewMap.getCanvas().style.cursor = '';
    });
  });
}

// ── Search ─────────────────────────────────────────────────────────
document.getElementById('search-box').addEventListener('input', e => {
  // Disconnect observer before rebuild so old targets don't fire
  if (chartObserver) chartObserver.disconnect();
  buildPage(e.target.value);
  // Re-observe freshly created containers
  if (chartObserver) {
    document.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
      chartObserver.observe(el);
    });
  }
});

loadData();
</script>
</body>
</html>
