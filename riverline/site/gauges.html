<!DOCTYPE html>

<style>
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
    --nav-h:   44px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--base); }
  body { font-family: var(--sans); background: var(--base); color: var(--text); padding-top: var(--nav-h); }

  /* ── Nav ─────────────────────────────────────────────────────────── */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 200;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
  }
  .nav-brand { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: lowercase; white-space: nowrap; }
  .nav-sep { color: var(--dim); font-size: 12px; }
  .nav-links { display: flex; gap: 2px; }
  .nav-links a { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 4px; text-decoration: none; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
  .nav-links a:hover { background: rgba(74,143,186,0.1); color: var(--accent); }
  .nav-links a.active { background: rgba(74,143,186,0.12); color: var(--accent); }

  /* ── Loading overlay ─────────────────────────────────────────────── */
  #loading-overlay {
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 100;
    background: var(--base); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    transition: opacity 0.3s;
  }
  #loading-overlay.fade { opacity: 0; pointer-events: none; }

  /* ── Overview map ────────────────────────────────────────────────── */
  #overview-map { height: 460px; width: 100%; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; }
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { display: none !important; }
  .mapboxgl-ctrl-group { background: rgba(14,28,45,0.92) !important; border: 1px solid var(--border) !important; }
  .mapboxgl-ctrl-group button { background-color: transparent !important; }
  .mapboxgl-ctrl-icon { filter: invert(0.7); }
  #map-legend {
    position: absolute; bottom: 14px; right: 14px; z-index: 10;
    background: rgba(8,15,24,0.90); border: 1px solid var(--border); border-radius: 7px;
    padding: 10px 12px; pointer-events: none; display: flex; gap: 20px;
  }
  .leg-col { display: flex; flex-direction: column; gap: 5px; }
  .leg-title { font-family: var(--mono); font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 2px; }
  .leg-row { display: flex; align-items: center; gap: 8px; }
  .leg-dot-wrap { width: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .leg-dot { border-radius: 50%; flex-shrink: 0; }
  .leg-txt { font-family: var(--mono); font-size: 9px; color: #8090a0; white-space: nowrap; }

  /* ── Page body ───────────────────────────────────────────────────── */
  .page-body { max-width: 1360px; margin: 0 auto; padding: 0 16px 60px; }

  .page-toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .search-box {
    flex: 1; max-width: 280px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 10px; font-family: var(--mono); font-size: 11px;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }
  .chart-legend-global { display: flex; align-items: center; gap: 12px; }
  .clg-item { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .clg-swatch { width: 18px; height: 7px; border-radius: 2px; }
  #gauge-stats { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; margin-left: auto; }

  /* ── Basin section ───────────────────────────────────────────────── */
  .basin-section { margin-top: 14px; }
  .basin-header {
    display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none;
    padding: 5px 0 8px; border-bottom: 2px solid var(--border);
    transition: border-color 0.15s;
  }
  .basin-header:hover { border-color: var(--accent); }
  .basin-toggle { font-size: 11px; color: var(--muted); width: 14px; flex-shrink: 0; transition: transform 0.2s; }
  .basin-name { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--accent); }
  .basin-count { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .basin-content { display: none; }
  .basin-section.open > .basin-content { display: block; }
  .basin-section.open > .basin-header > .basin-toggle { transform: rotate(90deg); }

  /* ── River group ──────────────────────────────────────────────────── */
  .river-group { margin-top: 8px; }
  .river-group-header {
    display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
    font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 3px 0 5px; border-bottom: 1px solid rgba(26,47,69,0.6);
    transition: color 0.15s;
  }
  .river-group-header:hover { color: var(--text); }
  .rg-toggle { font-size: 9px; color: var(--dim); flex-shrink: 0; }
  .river-group-header span { color: var(--dim); font-weight: 400; }
  .gauge-grid { display: none; margin-top: 6px; }
  .river-group.open > .gauge-grid { display: grid; }

  .gauge-grid {
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 8px;
  }

  /* ── Gauge card ──────────────────────────────────────────────────── */
  .gauge-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
    overflow: hidden;
  }
  .gauge-card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 8px 11px 6px; border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .gauge-card-left { flex: 1; min-width: 0; }
  .gauge-card-name {
    font-size: 11px; font-weight: 600; color: var(--text);
    line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gauge-card-id { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 1px; }
  .gauge-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .gauge-card-cfs { font-family: var(--mono); font-size: 16px; font-weight: 700; line-height: 1; }
  .gauge-card-unit { font-family: var(--sans); font-size: 9px; color: var(--muted); margin-left: 2px; }
  .gauge-card-cls {
    font-family: var(--mono); font-size: 8px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.4px; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  }

  /* ── Chart container ─────────────────────────────────────────────── */
  .chart-container { position: relative; height: 110px; }
  .chart-placeholder {
    position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--surface);
  }
  .chart-placeholder.hidden { display: none; }

  /* ── Card footer ─────────────────────────────────────────────────── */
  .gauge-card-footer {
    display: flex; align-items: center; gap: 8px; padding: 4px 11px;
    border-top: 1px solid var(--border); background: rgba(0,0,0,0.1);
  }
  .gauge-card-link { font-family: var(--mono); font-size: 9px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
  .gauge-card-link:hover { color: var(--accent); }
  .gauge-card-ts { font-family: var(--mono); font-size: 9px; color: var(--dim); margin-left: auto; }

  @media (max-width: 560px) {
    .gauge-grid { grid-template-columns: 1fr; }
    #overview-map { height: 200px; }
    .chart-legend-global { display: none; }
  }

  /* ── Mapbox popup ────────────────────────────────────────────────── */
  .mapboxgl-popup-content {
    background: rgba(8,15,24,0.96) !important;
    border: 1px solid #1a2f45 !important;
    border-radius: 6px !important;
    padding: 7px 11px !important;
    box-shadow: none !important;
  }
  .mapboxgl-popup-tip { display: none; }
  .popup-name { font-family: 'JetBrains Mono',monospace; font-size: 11px; font-weight: 600; color: #d4dde8; }
  .popup-cfs  { font-family: 'JetBrains Mono',monospace; font-size: 11px; margin-top: 2px; }
</style>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiaXRvZ2VvIiwiYSI6ImNta3ByYnA1bzBsYW0zZG9mMnMxdWZwMjUifQ.Q7pwAuAEKdBHD_dqaVBhvw';

// ── CLS color scale: diverging red → slate → blue ──────────────────
const CLS_COLOR = {
  1: '#c84030',  // much below normal — red
  2: '#cc6020',  // below normal — rust/orange
  3: '#6a8a9a',  // normal — slate blue
  4: '#28a8e0',  // above normal — sky blue
  5: '#1468d4',  // much above normal — deep blue
};
const CLS_LABEL = {
  1: 'Much Below Normal', 2: 'Below Normal', 3: 'Normal',
  4: 'Above Normal',      5: 'Much Above Normal',
};
const OFFLINE_COLOR = '#2a3f55';  // no data at all

// Small creeks run red; big rivers run deep blue — same direction as CLS scale.
function flowMagnitudeColor(cfs) {
  if (cfs <    10) return '#8b3a30';
  if (cfs <    50) return '#c05040';
  if (cfs <   200) return '#cc7030';
  if (cfs <   600) return '#8a7840';
  if (cfs <  1500) return '#6a8a9a';
  if (cfs <  5000) return '#28a8e0';
  if (cfs < 15000) return '#1878d0';
  return '#0a50c8';
}

const WY_START  = '2025-10-01';
const WY_MONTHS = [
  {m:10,days:31},{m:11,days:30},{m:12,days:31},
  {m:1,days:31},{m:2,days:28},{m:3,days:31},
  {m:4,days:30},{m:5,days:31},{m:6,days:30},
  {m:7,days:31},{m:8,days:31},{m:9,days:30},
];
const MONTH_ABBR = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Priority: USGS CLS percentile class → flow-magnitude color → offline gray
function gaugeColor(live) {
  const cls = parseInt(live.cls);
  if (cls >= 1 && cls <= 5) return CLS_COLOR[cls];
  const flow = live.flow != null ? Number(live.flow) : -1;
  if (flow >= 0) return flowMagnitudeColor(flow);
  return OFFLINE_COLOR;
}
function clsLabel(cls) { return CLS_LABEL[parseInt(cls)] || 'No Data'; }

function fmtCfs(v) {
  if (v == null || v === '' || isNaN(Number(v))) return null;
  const n = Number(v);
  if (n < 0) return null;
  return n >= 10000 ? (n/1000).toFixed(0)+'k'
       : n >= 1000  ? (n/1000).toFixed(1)+'k'
       : n.toFixed(0);
}
function parseStat(s) { const v = parseFloat(s); return isNaN(v) ? null : v; }

// ── Montana drainage basin definitions ────────────────────────────
const BASINS_DEF = [
  {
    name: 'SW Montana — Headwaters',
    rivers: ['Gallatin River','E Gallatin River','Hyalite C','Madison River',
             'Jefferson River','Beaverhead River','Big Hole River','Ruby River',
             'Red Rock River','Red Rock Creek','Blacktail Creek','Willow Creek'],
  },
  {

    rivers: ['Missouri River','MISSOURI RIVER NO. 4','MISSOURI RIVER NO. 5',
             'Smith River','Belt Creek','Dearborn River','Little Prickly Pear Creek',

  {

    rivers: ['Big Muddy Creek','Poplar River','Redwater River','Muddy Creek',
             'Nelson Creek','Sims Creek','Cains Coulee','Little Warm Creek Tributary'],
  },
  {
    name: 'Yellowstone River',
    rivers: ['Yellowstone River','Yellowstone River Fish Bypass Channel','Stillwater River',
             'Boulder River','East Boulder River','Clarks Fork Yellowstone River',
             'Shields River','Soda Butte Creek','Gardner River','Mill Creek',
             'Red Lodge Creek','West Rosebud Creek','W Rosebud Creek',
             'Rosebud C','Rosebud C Bel Lame Deer C'],
  },
  {
    name: 'Tongue & Powder',
    rivers: ['Tongue River','Powder River','Little Bighorn River','Lodge Grass Creek',
             'Bighorn River','Big Horn Canal','Clear Creek'],
  },
  {
    name: 'Clark Fork & Tributaries',
    rivers: ['Clark Fork','Silver Bow Creek','Warm Springs Creek','Little Blackfoot River',
             'Blackfoot River','NF Blackfoot River','Bitterroot River',
             'West Fork Bitterroot River','Bitterroot Irrigation District Canal',
             'Lake Como Spillway','Flint Creek','Georgetown Lake','Rock Creek',
             'Middle Fork Rock Creek','St. Regis River','Thompson River','Prospect Creek',
             'Lost Creek','South Fork Jocko River','Mission Creek',
             'Vermilion River','Vermilion River .63 mi','Vermilion River .78 mi',
             'Vermilion River 1.0 mi','Vermilion River 1100 ft','Vermilion River 1800 ft',
             'Vermilion River 400 ft','Vermilion River 50 ft',
             'Vermilion River, N channel, 0.55 mi','Vermilion River, S channel, 0.55 mi'],
  },
  {
    name: 'Flathead & Kootenai',
    rivers: ['Flathead River','N F Flathead River','M F Flathead River','S F Flathead River',
             'Swan River','Whitefish River','Tobacco River','Yaak River','Fisher River',
             'Libby Wetland Site','Kootenai River'],
  },
];

const BASIN_LOOKUP = new Map();
const BASIN_ORDER  = BASINS_DEF.map(b => {
  b.rivers.forEach(r => BASIN_LOOKUP.set(r, b.name));
  return b.name;
});

// ── App state ──────────────────────────────────────────────────────
let liveMap       = {};
let hierarchyData = [];
let overviewMap   = null;
let chartObserver = null;
const dvCache     = new Map();
const statsCache  = new Map();

// ── Bootstrap ─────────────────────────────────────────────────────
async function loadData() {
  const [hierResp, liveResp] = await Promise.allSettled([
    fetch('/river/data/river_hierarchy.json'),
    fetch('/river/api/gauges/mt'),
  ]);

  if (hierResp.status === 'fulfilled' && hierResp.value.ok) {
    hierarchyData = (await hierResp.value.json()).rivers || [];
  } else {
    document.getElementById('loading-overlay').textContent = 'Failed to load gauge data.';
    return;
  }

  if (liveResp.status === 'fulfilled' && liveResp.value.ok) {
    for (const f of ((await liveResp.value.json()).features || [])) {
      const p = f.properties;
      liveMap[p.id] = { flow: p.flow, ts: p.ts, cls: p.cls };
    }
  }

  const totalGauges = hierarchyData.reduce((s, r) => s + r.gauges.length, 0);
  const reporting   = Object.values(liveMap).filter(v => v.flow != null && Number(v.flow) >= 0).length;

  document.getElementById('gauge-stats').textContent =
    `${hierarchyData.length} rivers · ${totalGauges} gauges · ${reporting} reporting`;

  buildPage();
  initMap();
  setupObserver();

  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('fade');
  setTimeout(() => overlay.remove(), 350);
}

// ── Page builder ───────────────────────────────────────────────────
function buildPage(filter) {
  const q          = (filter || '').trim().toLowerCase();
  const isSearching = q.length > 0;
  const container  = document.getElementById('basin-sections');
  container.innerHTML = '';

  // Disconnect observer — will reconnect for newly visible elements below
  if (chartObserver) chartObserver.disconnect();

  // Group rivers by basin
  const basinMap = new Map();
  for (const river of hierarchyData) {
    const basinName = BASIN_LOOKUP.get(river.name) || 'Other Montana';
    const matchedGauges = isSearching
      ? river.gauges.filter(g =>
          g.name.toLowerCase().includes(q) ||
          river.name.toLowerCase().includes(q) ||
          basinName.toLowerCase().includes(q))
      : river.gauges;
    if (matchedGauges.length === 0) continue;
    if (!basinMap.has(basinName)) basinMap.set(basinName, []);
    basinMap.get(basinName).push({ ...river, gauges: matchedGauges });
  }

  const orderedBasins = [...BASIN_ORDER, 'Other Montana'].filter(b => basinMap.has(b));

  for (const basinName of orderedBasins) {
    const rivers      = basinMap.get(basinName);
    const totalGauges = rivers.reduce((s, r) => s + r.gauges.length, 0);

    const basinEl = document.createElement('div');
    basinEl.className = isSearching ? 'basin-section open' : 'basin-section';

    const basinHdr = document.createElement('div');
    basinHdr.className = 'basin-header';
    basinHdr.innerHTML =
      `<span class="basin-toggle">▶</span>` +
      `<span class="basin-name">${basinName}</span>` +
      `<span class="basin-count">${totalGauges} gauge${totalGauges !== 1 ? 's' : ''}</span>`;
    basinHdr.addEventListener('click', () => {
      basinEl.classList.toggle('open');
      // When expanding a basin, start observing any newly visible chart containers
      if (basinEl.classList.contains('open') && chartObserver) {
        basinEl.querySelectorAll('.gauge-grid').forEach(grid => {
          // Only observe if parent river-group is also open
          if (grid.parentElement.classList.contains('open')) {
            grid.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
              chartObserver.observe(el);
            });
          }
        });
      }
    });
    basinEl.appendChild(basinHdr);

    const basinContent = document.createElement('div');
    basinContent.className = 'basin-content';

    for (const river of rivers) {
      const group = document.createElement('div');
      group.className = isSearching ? 'river-group open' : 'river-group';

      const groupHdr = document.createElement('div');
      groupHdr.className = 'river-group-header';
      groupHdr.innerHTML =
        `<span class="rg-toggle">▶</span>${river.name} <span>· ${river.gauges.length}</span>`;
      groupHdr.addEventListener('click', () => {
        group.classList.toggle('open');
        if (group.classList.contains('open') && chartObserver) {
          group.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
            chartObserver.observe(el);
          });
        }
      });
      group.appendChild(groupHdr);

      const grid = document.createElement('div');
      grid.className = 'gauge-grid';

      for (const gauge of river.gauges) {
        const live   = liveMap[gauge.id] || {};
        const color  = gaugeColor(live);
        const cfsStr = fmtCfs(live.flow);
        const ts     = live.ts ? live.ts.slice(0, 10) : null;

        const card = document.createElement('div');
        card.className = 'gauge-card';
        card.id        = `gauge-${gauge.id}`;
        card.innerHTML =
          `<div class="gauge-card-head">
            <div class="gauge-card-left">
              <div class="gauge-card-name" title="${gauge.name}">${gauge.name}</div>
              <div class="gauge-card-id">${gauge.id}</div>
            </div>
            <div class="gauge-card-right">
              <div>
                <span class="gauge-card-cfs" style="color:${color}">${cfsStr || '—'}</span>
                <span class="gauge-card-unit">cfs</span>
              </div>
              <div class="gauge-card-cls" style="background:${color}18;color:${color}">${clsLabel(live.cls)}</div>
            </div>
          </div>
          <div class="chart-container" data-site-id="${gauge.id}" data-cls="${live.cls || 0}" data-loaded="false">
            <canvas></canvas>
            <div class="chart-placeholder">—</div>
          </div>
          <div class="gauge-card-footer">
            <a class="gauge-card-link" href="https://waterdata.usgs.gov/monitoring-location/${gauge.id}/" target="_blank" rel="noopener">USGS ↗</a>
            ${ts ? `<span class="gauge-card-ts">${ts}</span>` : ''}
          </div>`;
        grid.appendChild(card);
      }

      group.appendChild(grid);
      basinContent.appendChild(group);
    }

    basinEl.appendChild(basinContent);
    container.appendChild(basinEl);
  }

  // Re-attach observer to any visible containers (open sections during search)
  if (chartObserver) {
    document.querySelectorAll('.river-group.open .chart-container[data-loaded="false"]').forEach(el => {
      chartObserver.observe(el);
    });
  }
}

// ── IntersectionObserver for lazy chart loading ────────────────────
function setupObserver() {
  chartObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const c = entry.target;
      if (c.dataset.loaded !== 'false') continue;
      c.dataset.loaded = 'loading';
      chartObserver.unobserve(c);
      loadGaugeChart(c);
    }
  }, { rootMargin: '400px' });

  // Initially nothing is open so nothing to observe yet
}

// ── Gauge chart loader ─────────────────────────────────────────────
async function loadGaugeChart(container) {
  const siteId      = container.dataset.siteId;
  const live        = liveMap[siteId] || {};
  const lineColor   = gaugeColor(live);
  const canvas      = container.querySelector('canvas');
  const placeholder = container.querySelector('.chart-placeholder');

  try {
    const dvP = dvCache.has(siteId)
      ? Promise.resolve(dvCache.get(siteId))
      : fetch(`https://waterservices.usgs.gov/nwis/dv/?sites=${siteId}&parameterCd=00060&startDT=${WY_START}&format=json`)
          .then(r => r.ok ? r.json() : null).catch(() => null);

    const statsP = statsCache.has(siteId)
      ? Promise.resolve(statsCache.get(siteId))
      : fetch(`https://waterservices.usgs.gov/nwis/stat/?format=rdb&sites=${siteId}&parameterCd=00060&statReportType=daily&statType=p10,p25,p50,p75,p90`)
          .then(r => r.ok ? r.text() : null).catch(() => null);

    const [dvData, statsText] = await Promise.all([dvP, statsP]);
    if (!dvCache.has(siteId))    dvCache.set(siteId, dvData);
    if (!statsCache.has(siteId)) statsCache.set(siteId, statsText);

    // Parse USGS stats RDB → 'MM-DD' → percentiles
    const doyMap = new Map();
    if (statsText) {
      const lines   = statsText.split('\n').filter(l => l && !l.startsWith('#'));
      const headers = lines[0]?.split('\t').map(h => h.trim()) || [];
      for (const line of lines.slice(2)) {
        const cols = line.split('\t');
        if (cols.length < headers.length) continue;
        const row = Object.fromEntries(headers.map((h, i) => [h, cols[i]]));
        const m   = (row.month_nu || '').padStart(2, '0');
        const d   = (row.day_nu   || '').padStart(2, '0');
        if (!m || !d || isNaN(parseInt(m, 10))) continue;
        doyMap.set(`${m}-${d}`, {
          p10: parseStat(row.p10_va), p25: parseStat(row.p25_va),
          p50: parseStat(row.p50_va), p75: parseStat(row.p75_va),
          p90: parseStat(row.p90_va),
        });
      }
    }

    // Parse USGS DV JSON → 'YYYY-MM-DD' → cfs
    const flowMap = new Map();
    if (dvData) {
      const fs = (dvData?.value?.timeSeries || [])
        .find(s => s.variable?.variableCode?.[0]?.value === '00060');
      for (const v of (fs?.values?.[0]?.value || [])) {
        const fl = parseFloat(v.value);
        if (!isNaN(fl) && fl >= 0) flowMap.set(v.dateTime.slice(0, 10), fl);
      }
    }

    // Build water-year date spine (Oct 1 2025 → today)
    const todayStr = new Date().toISOString().slice(0, 10);
    const labels   = [];
    const p10 = [], p25 = [], p50 = [], p75 = [], p90 = [], actual = [];

    for (const {m, days: md} of WY_MONTHS) {
      for (let day = 1; day <= md; day++) {
        const mStr    = String(m).padStart(2, '0');
        const dStr    = String(day).padStart(2, '0');
        const yr      = m >= 10 ? 2025 : 2026;
        const dateStr = `${yr}-${mStr}-${dStr}`;
        if (dateStr > todayStr) continue;
        labels.push(day === 1 ? MONTH_ABBR[m] : '');
        const stats = doyMap.get(`${mStr}-${dStr}`) || {};
        p10.push(stats.p10 ?? null); p25.push(stats.p25 ?? null);
        p50.push(stats.p50 ?? null); p75.push(stats.p75 ?? null);
        p90.push(stats.p90 ?? null);
        actual.push(flowMap.get(dateStr) ?? null);
      }
    }

    if (!doyMap.size && !actual.some(v => v != null)) {
      placeholder.textContent = 'No data';
      container.dataset.loaded = 'empty';
      return;
    }

    placeholder.classList.add('hidden');

    new Chart(canvas, {
      type: 'line',
      data: { labels, datasets: [
        { data: p90, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(74,143,186,0.15)', pointRadius: 0, tension: 0.3, spanGaps: true },
        { data: p75, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(34,197,94,0.11)', pointRadius: 0, tension: 0.3, spanGaps: true },
        { data: p25, borderColor: 'transparent', fill: '+1', backgroundColor: 'rgba(245,158,11,0.13)', pointRadius: 0, tension: 0.3, spanGaps: true },
        { data: p10, borderColor: 'transparent', fill: false, pointRadius: 0, tension: 0.3, spanGaps: true },
        { data: p50, borderColor: 'rgba(74,143,186,0.30)', borderWidth: 1, borderDash: [3,2], fill: false, pointRadius: 0, tension: 0.3, spanGaps: true },
        { data: actual, borderColor: lineColor, borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.2, spanGaps: false },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            mode: 'index', intersect: false,
            filter: item => item.datasetIndex >= 4,
            backgroundColor: 'rgba(8,15,24,0.96)',
            titleColor: '#455a70', bodyColor: '#d4dde8',
            borderColor: '#1a2f45', borderWidth: 1, padding: 7,
            titleFont: { family: "'JetBrains Mono',monospace", size: 9 },
            bodyFont:  { family: "'JetBrains Mono',monospace", size: 10, weight: '600' },
            callbacks: {
              label: ctx => {
                if (ctx.parsed.y == null) return '';
                const v = ctx.parsed.y;
                const s = v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0);
                return ctx.datasetIndex === 4 ? `Med  ${s} cfs` : `Flow ${s} cfs`;
              },
            },
          },
        },
        scales: {
          x: {
            ticks: { color: '#455a70', font: { family: "'JetBrains Mono',monospace", size: 7 }, maxTicksLimit: 13, maxRotation: 0 },
            grid: { color: 'rgba(255,255,255,0.025)' }, border: { color: '#1a2f45' },
          },
          y: {
            ticks: { color: '#455a70', font: { family: "'JetBrains Mono',monospace", size: 7 }, maxTicksLimit: 4,
              callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v },
            grid: { color: 'rgba(255,255,255,0.035)' }, border: { color: '#1a2f45' },
          },
        },
      },
    });

    container.dataset.loaded = 'done';
  } catch {
    placeholder.textContent = 'Chart unavailable';
    container.dataset.loaded = 'error';
  }
}

// ── Mapbox overview map ────────────────────────────────────────────
function initMap() {
  overviewMap = new mapboxgl.Map({
    container: 'overview-map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [-109.5, 47.0],
    zoom: 4.8,
  });
  overviewMap.dragRotate.disable();
  overviewMap.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

  const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });

  overviewMap.on('load', () => {
    // Highlight the Montana river network using Mapbox Streets waterway data.
    // This gives real river geometry instead of artificial gauge-connecting lines.
    overviewMap.addLayer({
      id: 'waterways-hl',
      type: 'line',
      source: 'composite',
      'source-layer': 'waterway',
      filter: ['match', ['get', 'class'], ['river', 'stream', 'canal'], true, false],
      paint: {
        'line-color': ['interpolate', ['linear'], ['zoom'],
          3, '#1a4060',
          7, '#1e5a80',
          10, '#2272a0',
        ],
        'line-width': ['interpolate', ['linear'], ['zoom'],
          3, 0.5,
          6, 1.2,
          9, 2.5,
          12, 4,
        ],
        'line-opacity': 0.7,
      },
    });

    const dotFeatures = [];
    for (const river of hierarchyData) {
      for (const gauge of river.gauges) {
        if (!gauge.coords || gauge.coords.length < 2) continue;
        const live  = liveMap[gauge.id] || {};
        const flow  = live.flow != null ? Number(live.flow) : -1;
        const color = gaugeColor(live);
        dotFeatures.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: gauge.coords },
          properties: { id: gauge.id, name: gauge.name, flow, color },
        });
      }
    }

    // Gauge dots — sized by log10(flow), colored by CLS
    overviewMap.addSource('gauges', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: dotFeatures },
    });
    overviewMap.addLayer({
      id: 'gauge-dots',
      type: 'circle',
      source: 'gauges',
      paint: {
        'circle-radius': [
          'interpolate', ['linear'],
          ['log10', ['+', ['max', ['coalesce', ['get', 'flow'], 0], 0], 1]],
          0, 3,
          1, 4,
          2, 5.5,
          3, 8,
          4, 12,
          5, 16,
        ],
        'circle-color':        ['get', 'color'],
        'circle-opacity':       0.92,
        'circle-stroke-width':  0.8,
        'circle-stroke-color': 'rgba(0,0,0,0.4)',
      },
    });

    // Click → scroll to gauge card (expand its basin + river group first)
    overviewMap.on('click', 'gauge-dots', e => {
      const id = e.features[0]?.properties?.id;
      if (!id) return;
      // Expand the containing basin and river group
      const cardEl = document.getElementById(`gauge-${id}`);
      if (cardEl) {
        const group  = cardEl.closest('.river-group');
        const basin  = cardEl.closest('.basin-section');
        if (basin  && !basin.classList.contains('open'))  basin.classList.add('open');
        if (group  && !group.classList.contains('open'))  {
          group.classList.add('open');
          // Trigger chart observation for newly revealed cards
          if (chartObserver) {
            group.querySelectorAll('.chart-container[data-loaded="false"]').forEach(el => {
              chartObserver.observe(el);
            });
          }
        }
        setTimeout(() => {
          window.scrollTo({ top: cardEl.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' });
        }, 50);
      }
    });

    // Hover → popup
    overviewMap.on('mouseenter', 'gauge-dots', e => {
      const p = e.features[0]?.properties;
      if (!p) return;
      const flowNum = Number(p.flow);
      const flowStr = flowNum >= 0 ? `${fmtCfs(flowNum)} cfs` : 'No data';
      popup.setLngLat(e.lngLat)
        .setHTML(`<div class="popup-name">${p.name}</div>` +
                 `<div class="popup-cfs" style="color:${p.color}">${flowStr}</div>`)
        .addTo(overviewMap);
      overviewMap.getCanvas().style.cursor = 'pointer';
    });
    overviewMap.on('mouseleave', 'gauge-dots', () => {
      popup.remove();
      overviewMap.getCanvas().style.cursor = '';
    });
  });
}

// ── Search ─────────────────────────────────────────────────────────
document.getElementById('search-box').addEventListener('input', e => {
  buildPage(e.target.value);
});

loadData();
