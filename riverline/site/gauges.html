<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverLine — Montana Gauges</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
    --nav-h:   44px;
    --sidebar: 340px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--base); color: var(--text); }

  /* ── Nav ─────────────────────────────────────────────────────────── */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 200;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 8px;
  }
  .nav-brand { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: lowercase; white-space: nowrap; }
  .nav-sep { color: var(--dim); font-size: 12px; }
  .nav-links { display: flex; gap: 2px; }
  .nav-links a { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 4px; text-decoration: none; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; transition: background 0.15s, color 0.15s; white-space: nowrap; }
  .nav-links a:hover { background: rgba(74,143,186,0.1); color: var(--accent); }
  .nav-links a.active { background: rgba(74,143,186,0.12); color: var(--accent); }

  /* ── Layout ──────────────────────────────────────────────────────── */
  .page-layout {
    display: flex; height: 100vh; padding-top: var(--nav-h);
  }

  /* ── Sidebar ─────────────────────────────────────────────────────── */
  .gauge-sidebar {
    width: var(--sidebar); flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .sidebar-top {
    padding: 14px 14px 10px; flex-shrink: 0; border-bottom: 1px solid var(--border);
  }
  .sidebar-title {
    font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 4px;
  }
  .sidebar-stats {
    font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 10px;
  }
  .search-box {
    width: 100%; background: var(--base); border: 1px solid var(--border); border-radius: 5px;
    padding: 7px 10px; font-family: var(--mono); font-size: 11px; color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .search-box::placeholder { color: var(--muted); }
  .search-box:focus { border-color: var(--accent); }

  /* ── River list ──────────────────────────────────────────────────── */
  .river-list { flex: 1; overflow-y: auto; }
  .river-list::-webkit-scrollbar { width: 4px; }
  .river-list::-webkit-scrollbar-track { background: transparent; }
  .river-list::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

  .river-section { border-bottom: 1px solid var(--border); }
  .river-section.hidden { display: none; }

  .river-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; cursor: pointer; user-select: none;
    transition: background 0.1s;
  }
  .river-header:hover { background: rgba(255,255,255,0.03); }
  .river-header-left { display: flex; align-items: center; gap: 6px; }
  .river-name { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--text); }
  .river-count { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .river-toggle { font-size: 10px; color: var(--dim); transition: transform 0.15s; }
  .river-section.open .river-toggle { transform: rotate(180deg); }

  .gauge-rows { display: none; }
  .river-section.open .gauge-rows { display: block; }

  .gauge-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px 7px 22px; cursor: pointer;
    transition: background 0.1s; border-top: 1px solid rgba(255,255,255,0.03);
  }
  .gauge-row:hover { background: rgba(74,143,186,0.06); }
  .gauge-row.active { background: rgba(74,143,186,0.12); }

  .cls-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .gauge-row-name { font-family: var(--sans); font-size: 11px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gauge-row-cfs { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text); flex-shrink: 0; text-align: right; min-width: 52px; }
  .gauge-row-cfs.no-data { color: var(--muted); }

  /* ── Chart panel ─────────────────────────────────────────────────── */
  .chart-panel {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
  }

  .chart-empty {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; gap: 10px;
  }
  .chart-empty-icon { font-size: 32px; opacity: 0.3; }
  .chart-empty.hidden { display: none; }

  .gauge-detail { display: none; flex-direction: column; flex: 1; }
  .gauge-detail.visible { display: flex; }

  .gauge-hero { padding: 20px 28px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .gauge-hero-river {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px;
  }
  .gauge-hero-name {
    font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; line-height: 1.2;
  }
  .gauge-hero-flow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .gauge-cfs-num { font-family: var(--mono); font-size: 48px; font-weight: 700; line-height: 1; }
  .gauge-cfs-unit { font-family: var(--sans); font-size: 14px; color: var(--muted); }
  .gauge-hero-ts { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 10px; }
  .cls-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 4px;
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .cls-badge-dot { width: 7px; height: 7px; border-radius: 50%; }

  .gauge-links {
    display: flex; gap: 8px; padding: 12px 28px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .gauge-link {
    font-family: var(--mono); font-size: 10px; padding: 5px 12px; border-radius: 5px;
    background: rgba(74,143,186,0.1); color: var(--accent); text-decoration: none;
    border: 1px solid rgba(74,143,186,0.2); transition: background 0.15s;
  }
  .gauge-link:hover { background: rgba(74,143,186,0.18); }

  .chart-area { padding: 20px 28px; flex: 1; min-height: 280px; position: relative; }
  .chart-section-label {
    font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 12px;
  }
  #flow-chart { width: 100%; }

  .chart-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .chart-loading.hidden { display: none; }

  /* ── Loading overlay ─────────────────────────────────────────────── */
  #loading-overlay {
    position: fixed; inset: 0; top: var(--nav-h); z-index: 100;
    background: var(--base); display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    transition: opacity 0.3s;
  }
  #loading-overlay.fade { opacity: 0; pointer-events: none; }

  /* ── Mobile ──────────────────────────────────────────────────────── */
  @media (max-width: 680px) {
    :root { --sidebar: 100vw; }
    .page-layout { flex-direction: column; overflow: hidden; }
    .gauge-sidebar { width: 100%; height: 45vh; flex-shrink: 0; border-right: none; border-bottom: 1px solid var(--border); }
    .chart-panel { height: 55vh; overflow-y: auto; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <span class="nav-brand">itogeospatial</span>
  <div class="nav-links">
    <a href="/snow">Snow</a>
    <a href="/river" class="active">River</a>
  </div>
  <span class="nav-sep">/</span>
  <div class="nav-links">
    <a href="/river/">Map</a>
    <a href="/river/gauges" class="active">Gauges</a>
  </div>
</nav>

<div id="loading-overlay">Loading Montana gauges…</div>

<div class="page-layout">
  <aside class="gauge-sidebar">
    <div class="sidebar-top">
      <div class="sidebar-title">Montana Gauges</div>
      <div class="sidebar-stats" id="sidebar-stats">Loading…</div>
      <input type="search" class="search-box" id="search-box" placeholder="Search rivers or gauges…" autocomplete="off">
    </div>
    <div class="river-list" id="river-list"></div>
  </aside>

  <main class="chart-panel" id="chart-panel">
    <div class="chart-empty" id="chart-empty">
      <div class="chart-empty-icon">〜</div>
      <div>Select a gauge to view conditions</div>
    </div>
    <div class="gauge-detail" id="gauge-detail">
      <div class="gauge-hero">
        <div class="gauge-hero-river" id="hero-river"></div>
        <div class="gauge-hero-name" id="hero-name"></div>
        <div class="gauge-hero-flow">
          <span class="gauge-cfs-num" id="hero-cfs">—</span>
          <span class="gauge-cfs-unit">cfs</span>
        </div>
        <div class="gauge-hero-ts" id="hero-ts"></div>
        <div id="hero-badge"></div>
      </div>
      <div class="gauge-links" id="gauge-links"></div>
      <div class="chart-area">
        <div class="chart-section-label">7-day flow record</div>
        <div class="chart-loading" id="chart-loading">Loading chart…</div>
        <canvas id="flow-chart"></canvas>
      </div>
    </div>
  </main>
</div>

<script>
const CLS_COLOR = { 1:'#c05040', 2:'#c8973a', 3:'#4a8fba', 4:'#4aabba', 5:'#4a5fba' };
const CLS_LABEL = { 1:'Much Below Normal', 2:'Below Normal', 3:'Normal', 4:'Above Normal', 5:'Much Above Normal' };
const NO_DATA_COLOR = '#455a70';

function clsColor(cls) { return CLS_COLOR[cls] || NO_DATA_COLOR; }
function clsLabel(cls) { return CLS_LABEL[cls] || 'No Data'; }
function fmtCfs(v) {
  if (v == null) return null;
  const n = Number(v);
  return n >= 10000 ? (n/1000).toFixed(0)+'k' : n >= 1000 ? (n/1000).toFixed(1)+'k' : n.toFixed(0);
}

let liveMap = {}; // id → {flow, ts, cls}
let hierarchyData = [];
let activeGaugeId = null;
let chartInstance = null;

async function loadData() {
  const [hierResp, liveResp] = await Promise.allSettled([
    fetch('/river/data/river_hierarchy.json'),
    fetch('/river/api/gauges/mt'),
  ]);

  if (hierResp.status === 'fulfilled' && hierResp.value.ok) {
    const j = await hierResp.value.json();
    hierarchyData = j.rivers || [];
  } else {
    document.getElementById('loading-overlay').textContent = 'Failed to load gauge data.';
    return;
  }

  if (liveResp.status === 'fulfilled' && liveResp.value.ok) {
    const geo = await liveResp.value.json();
    for (const f of (geo.features || [])) {
      const p = f.properties;
      liveMap[p.id] = { flow: p.flow, ts: p.ts, cls: p.cls };
    }
  }

  buildList();

  const total = hierarchyData.reduce((s, r) => s + r.gauges.length, 0);
  const reporting = Object.values(liveMap).filter(v => v.flow != null).length;
  document.getElementById('sidebar-stats').textContent =
    `${hierarchyData.length} rivers · ${total} gauges · ${reporting} reporting`;

  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('fade');
  setTimeout(() => overlay.remove(), 350);
}

function buildList(filter) {
  const q = (filter || '').trim().toLowerCase();
  const container = document.getElementById('river-list');
  container.innerHTML = '';

  for (const river of hierarchyData) {
    const rNameLow = river.name.toLowerCase();
    const matchedGauges = q
      ? river.gauges.filter(g => g.name.toLowerCase().includes(q) || rNameLow.includes(q))
      : river.gauges;

    if (q && matchedGauges.length === 0) continue;

    const section = document.createElement('div');
    section.className = 'river-section' + ((!q && river.gauges.length > 1) || q ? ' open' : ' open');
    section.dataset.river = river.name;

    const header = document.createElement('div');
    header.className = 'river-header';
    header.innerHTML = `
      <div class="river-header-left">
        <span class="river-name">${river.name}</span>
        <span class="river-count">${river.gauges.length}</span>
      </div>
      <span class="river-toggle">▲</span>`;
    header.addEventListener('click', () => {
      section.classList.toggle('open');
    });

    const rows = document.createElement('div');
    rows.className = 'gauge-rows';

    for (const gauge of matchedGauges) {
      const live = liveMap[gauge.id] || {};
      const color = clsColor(live.cls);
      const cfsStr = fmtCfs(live.flow);

      const row = document.createElement('div');
      row.className = 'gauge-row' + (gauge.id === activeGaugeId ? ' active' : '');
      row.dataset.id = gauge.id;
      row.dataset.river = river.name;
      row.innerHTML = `
        <div class="cls-dot" style="background:${color}"></div>
        <span class="gauge-row-name" title="${gauge.name}">${gauge.name}</span>
        <span class="gauge-row-cfs${cfsStr ? '' : ' no-data'}">${cfsStr || '—'}</span>`;
      row.addEventListener('click', () => selectGauge(gauge, river.name));
      rows.appendChild(row);
    }

    section.appendChild(header);
    section.appendChild(rows);
    container.appendChild(section);
  }
}

function selectGauge(gauge, riverName) {
  // Deactivate previous
  document.querySelectorAll('.gauge-row.active').forEach(el => el.classList.remove('active'));
  // Activate new
  const row = document.querySelector(`.gauge-row[data-id="${gauge.id}"]`);
  if (row) row.classList.add('active');
  activeGaugeId = gauge.id;

  const live = liveMap[gauge.id] || {};
  const color = clsColor(live.cls);
  const cfsStr = fmtCfs(live.flow);
  const ts = live.ts ? live.ts.slice(0, 16).replace('T', ' ') + ' UTC' : null;

  document.getElementById('chart-empty').classList.add('hidden');
  const detail = document.getElementById('gauge-detail');
  detail.classList.add('visible');

  document.getElementById('hero-river').textContent = riverName;
  document.getElementById('hero-name').textContent = gauge.name;

  const cfsEl = document.getElementById('hero-cfs');
  cfsEl.textContent = cfsStr || '—';
  cfsEl.style.color = cfsStr ? color : NO_DATA_COLOR;

  document.getElementById('hero-ts').textContent = ts ? 'As of ' + ts : 'No recent data';
  document.getElementById('hero-badge').innerHTML = `
    <div class="cls-badge" style="background:${color}20; color:${color}">
      <div class="cls-badge-dot" style="background:${color}"></div>
      ${clsLabel(live.cls)}
    </div>`;

  document.getElementById('gauge-links').innerHTML = `
    <a class="gauge-link" href="https://waterdata.usgs.gov/monitoring-location/${gauge.id}/" target="_blank" rel="noopener">USGS Page ↗</a>
    <a class="gauge-link" href="https://waterdata.usgs.gov/nwis/uv?site_no=${gauge.id}" target="_blank" rel="noopener">Live Graph ↗</a>`;

  loadChart(gauge.id, color);
}

async function loadChart(siteId, lineColor) {
  const loadingEl = document.getElementById('chart-loading');
  const canvas = document.getElementById('flow-chart');
  loadingEl.classList.remove('hidden');
  canvas.style.display = 'none';

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  try {
    const url = `https://waterservices.usgs.gov/nwis/iv/?sites=${siteId}&parameterCd=00060&period=P7D&format=json`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(resp.status);
    const data = await resp.json();

    const series = data?.value?.timeSeries;
    if (!series || !series.length) throw new Error('No series');
    const values = series[0]?.values?.[0]?.value || [];

    const labels = values.map(v => {
      const d = new Date(v.dateTime);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', hour12: true });
    });
    const points = values.map(v => parseFloat(v.value));

    loadingEl.classList.add('hidden');
    canvas.style.display = 'block';

    chartInstance = new Chart(canvas, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: points,
          borderColor: lineColor,
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointHoverBackgroundColor: lineColor,
          fill: true,
          backgroundColor: lineColor + '18',
          tension: 0.3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 300 },
        scales: {
          x: {
            ticks: {
              color: '#455a70',
              font: { family: "'JetBrains Mono', monospace", size: 9 },
              maxTicksLimit: 8,
              maxRotation: 0,
            },
            grid: { color: 'rgba(255,255,255,0.03)' },
            border: { color: '#1a2f45' },
          },
          y: {
            ticks: {
              color: '#455a70',
              font: { family: "'JetBrains Mono', monospace", size: 9 },
              callback: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v,
            },
            grid: { color: 'rgba(255,255,255,0.04)' },
            border: { color: '#1a2f45' },
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0e1c2d',
            borderColor: '#1a2f45',
            borderWidth: 1,
            titleColor: '#455a70',
            bodyColor: '#d4dde8',
            titleFont: { family: "'JetBrains Mono', monospace", size: 9 },
            bodyFont: { family: "'JetBrains Mono', monospace", size: 11, weight: '600' },
            callbacks: {
              label: ctx => {
                const v = ctx.parsed.y;
                const fmted = v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0);
                return fmted + ' cfs';
              },
            },
          },
        },
      },
    });
  } catch (e) {
    loadingEl.textContent = 'Chart unavailable';
    loadingEl.classList.remove('hidden');
    canvas.style.display = 'none';
  }
}

// Search
document.getElementById('search-box').addEventListener('input', e => {
  buildList(e.target.value);
});

loadData();
</script>
</body>
</html>
