<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiverLine — Montana Gauges</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<style>
  :root {
    --base:    #080f18;
    --surface: #0e1c2d;
    --border:  #1a2f45;
    --text:    #d4dde8;
    --muted:   #455a70;
    --dim:     #2a3f55;
    --accent:  #4a8fba;
    --mono:    'JetBrains Mono', monospace;
    --serif:   'Playfair Display', serif;
    --sans:    'Inter', sans-serif;
    --nav-h:   44px;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: var(--sans); background: var(--base); color: var(--text); }

  /* Nav */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 200;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 10px;
  }
  .nav-brand { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: lowercase; }
  .nav-sep { color: var(--dim); font-size: 12px; }
  .nav-links { display: flex; gap: 2px; margin-left: 8px; }
  .nav-links a { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 4px; text-decoration: none; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; transition: background 0.15s, color 0.15s; }
  .nav-links a:hover { background: rgba(74,143,186,0.1); color: var(--accent); }
  .nav-links a.active { background: rgba(74,143,186,0.12); color: var(--accent); }

  /* Map */
  #map { position: absolute; top: var(--nav-h); left: 0; right: 0; bottom: 0; }

  /* Legend */
  #legend {
    position: absolute; bottom: 28px; left: 16px; z-index: 100;
    background: rgba(14,28,45,0.88); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 13px; backdrop-filter: blur(6px);
  }
  .legend-title { font-family: var(--mono); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
  .legend-row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-family: var(--mono); font-size: 10px; color: var(--text); }
  .legend-row:last-child { margin-bottom: 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* Stats chip */
  #stats-chip {
    position: absolute; bottom: 28px; right: 16px; z-index: 100;
    background: rgba(14,28,45,0.88); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; backdrop-filter: blur(6px);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  #stats-chip strong { color: var(--accent); }

  /* Detail panel */
  #detail-panel {
    position: absolute; top: var(--nav-h); right: 0; bottom: 0; width: 320px; z-index: 150;
    background: var(--surface); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform 0.2s ease;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #detail-panel.open { transform: translateX(0); }
  .dp-head { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
  .dp-title { font-family: var(--serif); font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; max-width: 240px; }
  .dp-id { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 3px; }
  .dp-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 17px; padding: 0; line-height: 1; flex-shrink: 0; }
  .dp-close:hover { color: var(--text); }
  .dp-body { padding: 14px 16px; flex: 1; overflow-y: auto; }
  .dp-cfs { font-family: var(--mono); font-size: 38px; font-weight: 700; margin-bottom: 3px; }
  .dp-cfs span { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .dp-ts { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 14px; }
  .dp-class-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 4px; margin-bottom: 14px;
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .dp-class-dot { width: 8px; height: 8px; border-radius: 50%; }
  .dp-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 11px; }
  .dp-row .lbl { color: var(--muted); }
  .dp-row .val { font-family: var(--mono); color: var(--text); }
  .dp-links { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; }
  .dp-links a { font-family: var(--mono); font-size: 10px; padding: 5px 12px; border-radius: 5px; background: rgba(74,143,186,0.1); color: var(--accent); text-decoration: none; border: 1px solid rgba(74,143,186,0.2); }
  .dp-links a:hover { background: rgba(74,143,186,0.18); }
  .dp-loading { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 20px 0; }

  /* Loading overlay */
  #map-loading {
    position: absolute; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 120;
    display: flex; align-items: center; justify-content: center;
    background: var(--base); pointer-events: none;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    transition: opacity 0.4s;
  }
  #map-loading.hidden { opacity: 0; }

  @media (max-width: 640px) {
    #detail-panel { top: auto; right: 0; left: 0; width: 100%; height: 55vh; border-left: none; border-top: 1px solid var(--border); transform: translateY(100%); }
    #detail-panel.open { transform: translateY(0); }
    #legend { bottom: 62vh; }
    #stats-chip { display: none; }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <span class="nav-brand">itogeospatial</span>
  <div class="nav-links">
    <a href="https://line.itogeospatial.com/snow">Snow Cover</a>
    <a href="https://line.itogeospatial.com/river" class="active">River</a>
  </div>
  <span class="nav-sep">/</span>
  <div class="nav-links">
    <a href="/river/">Map</a>
    <a href="/river/gauges.html" class="active">Gauges</a>
  </div>
</nav>

<div id="map-loading">Loading Montana gauges…</div>
<div id="map"></div>

<div id="legend">
  <div class="legend-title">Flow vs. Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#c05040"></div>Much Below Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#c8973a"></div>Below Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#4a8fba"></div>Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#4aabba"></div>Above Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#4a5fba"></div>Much Above Normal</div>
  <div class="legend-row"><div class="legend-dot" style="background:#455a70"></div>No Data</div>
</div>

<div id="stats-chip"><strong id="stat-total">—</strong> active gauges · <strong id="stat-reporting">—</strong> with flow data</div>

<div id="detail-panel">
  <div class="dp-head">
    <div>
      <div class="dp-title" id="dp-title">—</div>
      <div class="dp-id" id="dp-id">—</div>
    </div>
    <button class="dp-close" id="dp-close">✕</button>
  </div>
  <div class="dp-body" id="dp-body">
    <div class="dp-loading">Select a gauge on the map.</div>
  </div>
  <div class="dp-links" id="dp-links"></div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiaXRvZ2VvIiwiYSI6ImNta3ByYnA1bzBsYW0zZG9mMnMxdWZwMjUifQ.Q7pwAuAEKdBHD_dqaVBhvw';

const CLS_COLOR = {
  1: '#c05040',
  2: '#c8973a',
  3: '#4a8fba',
  4: '#4aabba',
  5: '#4a5fba',
};
const CLS_LABEL = {
  1: 'Much Below Normal',
  2: 'Below Normal',
  3: 'Normal',
  4: 'Above Normal',
  5: 'Much Above Normal',
};
const NO_DATA_COLOR = '#455a70';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [-109.5, 47.0],
  zoom: 5.2,
  minZoom: 4,
});

map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

let gaugeFeatures = {};

map.on('load', async () => {
  let geojson;
  try {
    const resp = await fetch('/river/api/gauges/mt');
    if (!resp.ok) throw new Error(resp.status);
    geojson = await resp.json();
  } catch (e) {
    document.getElementById('map-loading').textContent = 'Failed to load gauge data. Try again soon.';
    return;
  }

  // Index features by site id
  for (const f of (geojson.features || [])) {
    gaugeFeatures[f.properties.id] = f.properties;
  }

  // Stats
  const total = geojson.features.length;
  const reporting = geojson.features.filter(f => f.properties.flow != null).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-reporting').textContent = reporting;

  // Add source
  map.addSource('gauges', { type: 'geojson', data: geojson });

  // Color expression: cls → color
  const colorExpr = [
    'case',
    ['==', ['get', 'cls'], 1], '#c05040',
    ['==', ['get', 'cls'], 2], '#c8973a',
    ['==', ['get', 'cls'], 3], '#4a8fba',
    ['==', ['get', 'cls'], 4], '#4aabba',
    ['==', ['get', 'cls'], 5], '#4a5fba',
    NO_DATA_COLOR,
  ];

  // Halo layer
  map.addLayer({
    id: 'gauges-halo',
    type: 'circle',
    source: 'gauges',
    paint: {
      'circle-radius': 10,
      'circle-color': colorExpr,
      'circle-opacity': 0.18,
      'circle-blur': 0.5,
    },
  });

  // Main dot layer
  map.addLayer({
    id: 'gauges-dots',
    type: 'circle',
    source: 'gauges',
    paint: {
      'circle-radius': [
        'interpolate', ['linear'], ['zoom'],
        4, 4,
        8, 7,
        12, 10,
      ],
      'circle-color': colorExpr,
      'circle-stroke-color': 'rgba(255,255,255,0.25)',
      'circle-stroke-width': 1,
      'circle-opacity': 0.9,
    },
  });

  // Pointer cursor
  map.on('mouseenter', 'gauges-dots', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'gauges-dots', () => { map.getCanvas().style.cursor = ''; });

  // Click to open panel
  map.on('click', 'gauges-dots', (e) => {
    const f = e.features[0];
    if (!f) return;
    openPanel(f.properties);
  });

  // Dismiss loading overlay
  const overlay = document.getElementById('map-loading');
  overlay.classList.add('hidden');
  setTimeout(() => { overlay.style.display = 'none'; }, 400);
});

function clsColor(cls) {
  return CLS_COLOR[cls] || NO_DATA_COLOR;
}

function openPanel(props) {
  const { id, name, flow, ts, cls } = props;
  document.getElementById('dp-title').textContent = name || id;
  document.getElementById('dp-id').textContent = `USGS ${id}`;

  const cfsStr = flow != null
    ? Number(flow) >= 1000
      ? (Number(flow) / 1000).toFixed(1) + 'k'
      : Number(flow).toFixed(0)
    : '—';

  const tsFmt = ts ? ts.slice(0, 16).replace('T', ' ') + ' UTC' : '—';
  const color = clsColor(cls);
  const label = cls ? (CLS_LABEL[cls] || 'Unknown') : 'No Data';

  document.getElementById('dp-body').innerHTML = `
    <div class="dp-cfs" style="color:${color}">${cfsStr}<span>cfs</span></div>
    <div class="dp-ts">${tsFmt}</div>
    <div class="dp-class-badge" style="background:${color}20; color:${color}">
      <div class="dp-class-dot" style="background:${color}"></div>
      ${label}
    </div>
    <div class="dp-row"><span class="lbl">Site ID</span><span class="val">${id}</span></div>
    <div class="dp-row"><span class="lbl">Network</span><span class="val">USGS NWIS</span></div>
  `;

  document.getElementById('dp-links').innerHTML = `
    <a href="https://waterdata.usgs.gov/monitoring-location/${id}/" target="_blank" rel="noopener">USGS Data ↗</a>
    <a href="https://waterdata.usgs.gov/nwis/uv?site_no=${id}" target="_blank" rel="noopener">Live Graph ↗</a>
  `;

  document.getElementById('detail-panel').classList.add('open');
}

document.getElementById('dp-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.remove('open');
});

// Close panel on map click (not on a gauge)
map.on('click', (e) => {
  const features = map.queryRenderedFeatures(e.point, { layers: ['gauges-dots'] });
  if (!features.length) {
    document.getElementById('detail-panel').classList.remove('open');
  }
});
</script>
</body>
</html>
